<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>NEON CHASER · 霓虹追逐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ===== HUD ===== */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#hud.active{display:block}
.top-bar{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 24px}
.info-card{background:rgba(5,10,20,.6);border:1px solid rgba(0,220,255,.3);border-radius:10px;padding:7px 14px;backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(0,220,255,.15)}
.info-card .label{font-size:10px;letter-spacing:2px;color:#7ad9e8;opacity:.85}
.info-card .value{font-size:20px;font-weight:700;color:#eaffff}
.info-card .value .unit{font-size:11px;color:#7ad9e8;margin-left:3px;font-weight:400}

.speedo{position:absolute;bottom:22px;right:26px;width:140px;height:140px;background:rgba(5,10,20,.6);border:2px solid rgba(0,220,255,.5);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,220,255,.25),inset 0 0 20px rgba(0,220,255,.1)}
.speedo #speed-val{font-size:38px;font-weight:800;color:#eaffff;text-shadow:0 0 12px rgba(0,220,255,.7);line-height:1}
.speedo #speed-unit{font-size:12px;color:#7ad9e8;margin-top:2px}

.lap-info{position:absolute;bottom:26px;left:26px}
.lap-info .row{display:flex;gap:10px;margin-bottom:3px}
.lap-info .tag{color:#7ad9e8;font-size:11px;width:60px}
.lap-info .num{color:#eaffff;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

.minimap{position:absolute;top:64px;left:24px;width:130px;height:130px;background:rgba(5,10,20,.6);border:1px solid rgba(0,220,255,.4);border-radius:8px;overflow:hidden}
.minimap canvas{width:100%;height:100%}

/* 相机/音乐按钮 */
.hud-btn{position:absolute;pointer-events:auto;background:rgba(5,10,20,.6);border:1px solid rgba(0,220,255,.4);border-radius:8px;color:#eaffff;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(4px);transition:all .15s}
.hud-btn:hover{background:rgba(0,220,255,.2);box-shadow:0 0 14px rgba(0,220,255,.4)}
#cam-btn{top:14px;left:50%;transform:translateX(-50%)}
#music-btn{top:60px;left:50%;transform:translateX(-50%)}

/* ===== 菜单 ===== */
.overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(8,12,28,.9),rgba(0,0,0,.98));display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;padding:20px}
.overlay.active{display:flex}
.overlay h1{font-size:52px;font-weight:900;letter-spacing:8px;background:linear-gradient(90deg,#00dcff,#b066ff,#ff3c8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;text-align:center}
.overlay .sub{color:#7ad9e8;letter-spacing:6px;font-size:13px;margin-bottom:30px;text-align:center}

/* 地图选择 */
.map-grid{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:900px;margin-bottom:24px}
.map-card{width:240px;height:300px;border-radius:14px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .25s;position:absolute}
.map-card-wrap{width:240px;height:300px;border-radius:14px;overflow:hidden;cursor:pointer;border:2px solid rgba(255,255,255,.15);transition:all .25s;position:relative}
.map-card-wrap:hover{transform:translateY(-6px);border-color:rgba(0,220,255,.6);box-shadow:0 12px 40px rgba(0,220,255,.3)}
.map-card-wrap.selected{border-color:#00dcff;box-shadow:0 0 30px rgba(0,220,255,.5)}
.map-thumb{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:60px}
.map-info{padding:12px;background:rgba(5,10,20,.8)}
.map-info h3{font-size:16px;margin-bottom:4px}
.map-info p{font-size:11px;color:#9ab;line-height:1.4}

.btn{background:linear-gradient(135deg,#00a8cc,#00dcff);border:none;color:#001018;padding:12px 40px;font-size:16px;font-weight:700;border-radius:8px;cursor:pointer;letter-spacing:2px;transition:transform .15s,box-shadow .15s;margin:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,220,255,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;border:1px solid rgba(0,220,255,.5);color:#7ad9e8}

.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin:14px 0;text-align:left}
.controls-grid .key{display:inline-block;background:rgba(0,220,255,.15);border:1px solid rgba(0,220,255,.4);border-radius:5px;padding:2px 8px;font-size:11px;min-width:50px;text-align:center;color:#eaffff}
.controls-grid .desc{color:#b8d4e0;font-size:12px}

/* 倒计时 */
#countdown{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;pointer-events:none}
#countdown.active{display:flex}
#countdown .num{font-size:150px;font-weight:900;color:#fff;text-shadow:0 0 50px rgba(0,220,255,.9);animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{opacity:1}100%{transform:scale(1.5);opacity:0}}

/* 触控 */
#touch{position:fixed;inset:0;display:none;z-index:15;pointer-events:none}
#touch.active{display:block}
.t-btn{position:absolute;width:72px;height:72px;border-radius:50%;background:rgba(0,220,255,.15);border:2px solid rgba(0,220,255,.5);color:#eaffff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;backdrop-filter:blur(4px)}
.t-btn:active{background:rgba(0,220,255,.4)}
.t-left{left:20px;bottom:110px}
.t-right{left:108px;bottom:110px}
.t-gas{right:20px;bottom:110px}
.t-brake{right:108px;bottom:30px}

.result-row{display:flex;justify-content:space-between;padding:5px 0;color:#b8d4e0;font-size:14px}
.result-row .v{color:#eaffff;font-weight:600;font-variant-numeric:tabular-nums}
</style>

<script type="module">
import * as THREE from 'three';

// ===================== 配置 =====================
const CFG = {
  maxSpeed: 48,
  gas: 0.55,
  brakeForce: 1.2,
  friction: 0.35,
  steerMax: 0.75,
  steerSpeed: 7.5,
  highSpeedSteer: 0.72,
  trackWidth: 10,
  subStepMax: 1.0,
};

const MAP_THEMES = {
  neon: {
    name: '霓虹都市',
    icon: '🌃',
    desc: '夜之城赛道，霓虹摩天楼，赛博朋克氛围',
    sky: 0x0a0a1e,
    fog: 0x0a0a1e, fogDensity: 0.012,
    ground: 0x15152a,
    road: 0x222238,
    roadLine: 0x00dcff,
    curbA: 0xff2255, curbB: 0xffffff,
    accent: 0x00dcff,
    sun: 0xff6644, sunIntensity: 0.3,
    ambient: 0x3344aa, ambientIntensity: 0.5,
    buildingColors: [0x1a1a3a, 0x2a1a3a, 0x1a2a4a, 0x3a1a2a],
    neonColors: [0x00dcff, 0xff3c8a, 0xb066ff, 0x39ff14, 0xffaa00],
  },
  desert: {
    name: '沙漠夕阳',
    icon: '🏜️',
    desc: '烈日戈壁赛道，仙人掌与红岩，夕阳余晖',
    sky: 0xff8844,
    fog: 0xffaa66, fogDensity: 0.008,
    ground: 0xd4a574,
    road: 0x8a6a4a,
    roadLine: 0xffffff,
    curbA: 0xcc3333, curbB: 0xf0e0c0,
    accent: 0xff6622,
    sun: 0xffcc66, sunIntensity: 1.4,
    ambient: 0xff9955, ambientIntensity: 0.6,
    buildingColors: [0xb8865a, 0xa06a40, 0xc49a6a, 0x8a5a3a],
    neonColors: [0xff6622, 0xffcc44, 0xff4422],
  },
  sky: {
    name: '天空浮岛',
    icon: '☁️',
    desc: '云端浮岛赛道，瀑布与彩虹，梦幻高空',
    sky: 0x88ccff,
    fog: 0xaaddff, fogDensity: 0.006,
    ground: 0x66bb44,
    road: 0xeeeeff,
    roadLine: 0x6688ff,
    curbA: 0x66aaff, curbB: 0xffffff,
    accent: 0x66aaff,
    sun: 0xffffee, sunIntensity: 1.2,
    ambient: 0xaaccff, ambientIntensity: 0.7,
    buildingColors: [0xddccff, 0xffeedd, 0xccddee, 0xeeddff],
    neonColors: [0x66aaff, 0xff88cc, 0x88ffcc],
  },
};

// ===================== 全局状态 =====================
let scene, camera, renderer, clock;
let currentTheme = null;
let trackPoints = [], trackCurve = null;
let trackLength = 0;
let worldGroup = null;
let car = null, carPos, carVel, carHeading, carSteer;
let obstacles = [];
let aiCars = [];
let gameState = 'menu'; // menu, countdown, racing, finished
let distance = 0, raceTime = 0, maxSpeedReached = 0;
let cameraMode = 3; // 1 = first person, 3 = third person
let trackProgress = 0;
let bestTimes = {};
let input = { left:false, right:false, gas:true, brake:false };
let audioCtx = null, musicNodes = null, musicOn = true;

// ===================== 工具 =====================
function rand(a,b){return a+Math.random()*(b-a)}
function randInt(a,b){return Math.floor(rand(a,b+1))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function lerp(a,b,t){return a+(b-a)*t}

function makeCanvasTexture(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;return t;
}

// ===================== 音乐系统 (Synthwave) =====================
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
}

function startMusic(theme){
  if(!audioCtx) initAudio();
  if(audioCtx.state==='suspended') audioCtx.resume();
  stopMusic();
  if(!musicOn) return;

  const tempo = 120;
  const beat = 60/tempo;
  const t = audioCtx.currentTime;

  // master
  const master = audioCtx.createGain();
  master.gain.value = 0.35;
  master.connect(audioCtx.destination);

  // compressor
  const comp = audioCtx.createDynamicsCompressor();
  comp.connect(master);

  // --- bass line ---
  const bassNotes = [55, 55, 82.4, 73.4, 65.4, 65.4, 82.4, 98]; // A1 pattern
  const bassGain = audioCtx.createGain();
  bassGain.gain.value = 0.5;
  bassGain.connect(comp);

  function scheduleBass(startT){
    for(let i=0;i<16;i++){
      const note = bassNotes[i%bassNotes.length];
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = note;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0, startT+i*beat*0.5);
      g.gain.linearRampToValueAtTime(0.3, startT+i*beat*0.5+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, startT+i*beat*0.5+beat*0.4);
      const filt = audioCtx.createBiquadFilter();
      filt.type='lowpass'; filt.frequency.value=400;
      osc.connect(filt); filt.connect(g); g.connect(bassGain);
      osc.start(startT+i*beat*0.5);
      osc.stop(startT+i*beat*0.5+beat*0.5);
    }
  }

  // --- arpeggio lead ---
  const leadScale = [220, 261.6, 329.6, 392, 523.2, 659.2, 783.9, 523.2];
  const leadGain = audioCtx.createGain();
  leadGain.gain.value = 0.15;
  leadGain.connect(comp);

  function scheduleLead(startT){
    for(let i=0;i<32;i++){
      const note = leadScale[i%leadScale.length];
      const osc = audioCtx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = note;
      const g = audioCtx.createGain();
      const t0 = startT+i*beat*0.25;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.2, t0+0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t0+beat*0.2);
      const filt = audioCtx.createBiquadFilter();
      filt.type='lowpass'; filt.frequency.value=2500; filt.Q.value=5;
      osc.connect(filt); filt.connect(g); g.connect(leadGain);
      osc.start(t0); osc.stop(t0+beat*0.22);
    }
  }

  // --- drums ---
  const drumGain = audioCtx.createGain();
  drumGain.gain.value = 0.4;
  drumGain.connect(comp);

  function kick(time){
    const osc = audioCtx.createOscillator();
    osc.frequency.setValueAtTime(120, time);
    osc.frequency.exponentialRampToValueAtTime(40, time+0.12);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.8, time);
    g.gain.exponentialRampToValueAtTime(0.001, time+0.15);
    osc.connect(g); g.connect(drumGain);
    osc.start(time); osc.stop(time+0.16);
  }
  function snare(time){
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.2, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const filt = audioCtx.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=1000;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.5, time);
    g.gain.exponentialRampToValueAtTime(0.001, time+0.1);
    src.connect(filt); filt.connect(g); g.connect(drumGain);
    src.start(time); src.stop(time+0.12);
  }
  function hihat(time){
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.05, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const filt = audioCtx.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=7000;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.15, time);
    g.gain.exponentialRampToValueAtTime(0.001, time+0.03);
    src.connect(filt); filt.connect(g); g.connect(drumGain);
    src.start(time); src.stop(time+0.04);
  }

  function scheduleDrums(startT){
    for(let i=0;i<16;i++){
      kick(startT+i*beat);
      if(i%2===1) snare(startT+i*beat);
      hihat(startT+i*beat*0.5);
      hihat(startT+i*beat);
    }
  }

  // loop
  const loopLen = beat*16;
  scheduleBass(t); scheduleLead(t); scheduleDrums(t);
  const loopTimer = setInterval(()=>{
    if(!musicNodes){clearInterval(loopTimer);return}
    const now = audioCtx.currentTime;
    scheduleBass(now); scheduleLead(now); scheduleDrums(now);
  }, loopLen*1000);

  musicNodes = {master, loopTimer};
}

function stopMusic(){
  if(musicNodes){
    clearInterval(musicNodes.loopTimer);
    try{musicNodes.master.disconnect()}catch(e){}
    musicNodes = null;
  }
}

// ===================== 场景初始化 =====================
function initScene(){
  scene = new THREE.Scene();
  clock = new THREE.Clock();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 2000);
  camera.position.set(0, 8, -12);

  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', onResize);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function applyTheme(theme){
  currentTheme = theme;
  scene.background = new THREE.Color(theme.sky);
  scene.fog = new THREE.FogExp2(theme.fog, theme.fogDensity);

  // lights
  scene.children.forEach(c=>{ if(c.isLight) scene.remove(c) });
  const amb = new THREE.AmbientLight(theme.ambient, theme.ambientIntensity);
  scene.add(amb);
  const sun = new THREE.DirectionalLight(theme.sun, theme.sunIntensity);
  sun.position.set(50, 100, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-150; sun.shadow.camera.right=150;
  sun.shadow.camera.top=150; sun.shadow.camera.bottom=-150;
  sun.shadow.camera.near=1; sun.shadow.camera.far=400;
  scene.add(sun);
  // rim light
  const rim = new THREE.DirectionalLight(theme.accent, 0.4);
  rim.position.set(-30, 50, -30);
  scene.add(rim);

  // hemi for nicer ambient
  const hemi = new THREE.HemisphereLight(theme.sky, theme.ground, 0.4);
  scene.add(hemi);
}

// ===================== 赛道生成 (点到点，非环形) =====================
function generateTrack(themeKey){
  trackPoints = [];
  const segs = 14;
  let x=0, z=0;
  let angle = 0;
  for(let i=0;i<=segs;i++){
    const yOff = themeKey==='sky' ? Math.sin(i*0.8)*8 + (i*3) : (themeKey==='desert'? Math.sin(i*0.5)*2 : Math.sin(i*0.6)*3);
    trackPoints.push(new THREE.Vector3(x, yOff, z));
    if(i<segs){
      const turn = (Math.random()-0.5)*0.6;
      angle += turn;
      const len = rand(40, 70);
      x += Math.sin(angle)*len;
      z += Math.cos(angle)*len;
    }
  }
  trackCurve = new THREE.CatmullRomCurve3(trackPoints, false, 'catmullrom', 0.5);
  trackLength = trackCurve.getLength();
}

// ===================== 赛道渲染 =====================
function buildTrack(){
  if(worldGroup) scene.remove(worldGroup);
  worldGroup = new THREE.Group();
  scene.add(worldGroup);

  const theme = currentTheme;
  const divisions = Math.floor(trackLength * 2);
  const points = trackCurve.getSpacedPoints(divisions);
  const tangents = [];
  for(let i=0;i<=divisions;i++){
    tangents.push(trackCurve.getTangentAt(i/divisions));
  }

  // road mesh
  const roadGeo = new THREE.BufferGeometry();
  const verts = [], uvs = [], colors = [];
  const hw = CFG.trackWidth;
  for(let i=0;i<=divisions;i++){
    const p = points[i];
    const tan = tangents[i];
    const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    const left = p.clone().add(normal.clone().multiplyScalar(hw));
    const right = p.clone().add(normal.clone().multiplyScalar(-hw));
    verts.push(left.x,left.y,left.z, right.x,right.y,right.z);
    uvs.push(0, i*0.3, 1, i*0.3);
  }
  const idx = [];
  for(let i=0;i<divisions;i++){
    const a=i*2, b=i*2+1, c=i*2+2, d=i*2+3;
    idx.push(a,b,c, b,d,c);
  }
  roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
  roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  roadGeo.setIndex(idx);
  roadGeo.computeVertexNormals();

  // road texture with lane markings
  const roadTex = makeCanvasTexture(256, 256, (ctx,w,h)=>{
    ctx.fillStyle = '#'+theme.road.toString(16).padStart(6,'0');
    ctx.fillRect(0,0,w,h);
    // center dashed line
    ctx.strokeStyle = '#'+theme.roadLine.toString(16).padStart(6,'0');
    ctx.lineWidth = 6;
    ctx.setLineDash([20,20]);
    ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
    // edges
    ctx.setLineDash([]);
    ctx.strokeStyle = '#'+theme.curbA.toString(16).padStart(6,'0');
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(8,h); ctx.moveTo(w-8,0); ctx.lineTo(w-8,h); ctx.stroke();
    // asphalt noise
    for(let i=0;i<3000;i++){
      ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.15})`;
      ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2);
    }
  });
  roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
  const roadMat = new THREE.MeshStandardMaterial({map:roadTex, roughness:0.85, metalness:0.1});
  const roadMesh = new THREE.Mesh(roadGeo, roadMat);
  roadMesh.receiveShadow = true;
  worldGroup.add(roadMesh);

  // curbs (red-white stripes along edges)
  for(let side=-1; side<=1; side+=2){
    const curbGeo = new THREE.BufferGeometry();
    const cv = [], ci = [];
    for(let i=0;i<=divisions;i++){
      const p = points[i];
      const tan = tangents[i];
      const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
      const inner = p.clone().add(normal.clone().multiplyScalar(hw*side));
      const outer = p.clone().add(normal.clone().multiplyScalar((hw+1.2)*side));
      inner.y += 0.15; outer.y += 0.15;
      cv.push(inner.x,inner.y,inner.z, outer.x,outer.y,outer.z);
    }
    for(let i=0;i<divisions;i++){
      const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3;
      ci.push(a,b,c,b,d,c);
    }
    curbGeo.setAttribute('position', new THREE.Float32BufferAttribute(cv,3));
    curbGeo.setIndex(ci);
    curbGeo.computeVertexNormals();
    // curb texture
    const curbTex = makeCanvasTexture(64,256,(ctx,w,h)=>{
      for(let r=0;r<8;r++){
        ctx.fillStyle = r%2===0 ? '#'+theme.curbA.toString(16).padStart(6,'0') : '#'+theme.curbB.toString(16).padStart(6,'0');
        ctx.fillRect(0, r*h/8, w, h/8);
      }
    });
    curbTex.wrapT = THREE.RepeatWrapping;
    const curbMat = new THREE.MeshStandardMaterial({map:curbTex, roughness:0.7});
    const curbMesh = new THREE.Mesh(curbGeo, curbMat);
    curbMesh.receiveShadow = true;
    worldGroup.add(curbMesh);
  }

  // ground plane
  const groundGeo = new THREE.PlaneGeometry(2000, 2000);
  const groundTex = makeCanvasTexture(512,512,(ctx,w,h)=>{
    ctx.fillStyle = '#'+theme.ground.toString(16).padStart(6,'0');
    ctx.fillRect(0,0,w,h);
    for(let i=0;i<4000;i++){
      const a = Math.random()*0.1;
      ctx.fillStyle = `rgba(0,0,0,${a})`;
      ctx.fillRect(Math.random()*w, Math.random()*h, 3, 3);
    }
    for(let i=0;i<2000;i++){
      ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.05})`;
      ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2);
    }
  });
  groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
  groundTex.repeat.set(20,20);
  const groundMat = new THREE.MeshStandardMaterial({map:groundTex, roughness:1});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.05;
  ground.receiveShadow = true;
  worldGroup.add(ground);

  // tire barriers along track
  buildTireBarriers(points, tangents);
}

function buildTireBarriers(points, tangents){
  const theme = currentTheme;
  const tireGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 10);
  const tireMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.9});
  const stripeMat = new THREE.MeshStandardMaterial({color:theme.curbA, roughness:0.7, emissive:theme.curbA, emissiveIntensity:0.2});

  const step = 3;
  for(let side=-1; side<=1; side+=2){
    for(let i=0;i<points.length;i+=step){
      const p = points[i];
      const tan = tangents[i];
      const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
      const base = p.clone().add(normal.clone().multiplyScalar((CFG.trackWidth+2)*side));
      // stack 3 tires
      for(let s=0;s<3;s++){
        const tire = new THREE.Mesh(tireGeo, s%2===0? tireMat : stripeMat);
        tire.position.set(base.x, 0.2+s*0.4, base.z);
        tire.rotation.z = Math.PI/2;
        tire.castShadow = true;
        worldGroup.add(tire);
      }
    }
  }
}

// ===================== 环境建模 =====================
function buildScenery(){
  const theme = currentTheme;
  const themeKey = Object.keys(MAP_THEMES).find(k=>MAP_THEMES[k]===theme);

  // buildings / scenery along track
  const points = trackCurve.getSpacedPoints(60);
  const tangents = [];
  for(let i=0;i<=60;i++) tangents.push(trackCurve.getTangentAt(i/60));

  for(let i=0;i<points.length;i++){
    const p = points[i];
    const tan = tangents[i];
    const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

    for(let side=-1; side<=1; side+=2){
      // scatter at varying distances
      for(let d=1; d<=3; d++){
        if(Math.random()>0.5) continue;
        const dist = 14 + d*8 + Math.random()*8;
        const pos = p.clone().add(normal.clone().multiplyScalar(dist*side));
        pos.x += rand(-4,4); pos.z += rand(-4,4);

        if(themeKey==='neon'){
          addBuilding(pos, theme);
        } else if(themeKey==='desert'){
          if(Math.random()>0.5) addCactus(pos, theme);
          else addRock(pos, theme);
        } else {
          if(Math.random()>0.6) addCloud(pos, theme);
          else addTree(pos, theme);
        }
      }
    }
  }

  // theme-specific big features
  if(themeKey==='neon') addCitySkyline();
  else if(themeKey==='desert') addMesas();
  else addFloatingIslands();
}

function addBuilding(pos, theme){
  const h = rand(15, 50);
  const w = rand(6, 14);
  const d = rand(6, 14);
  const geo = new THREE.BoxGeometry(w, h, d);
  const color = pick(theme.buildingColors);
  const winTex = makeCanvasTexture(128, 256, (ctx,cw,ch)=>{
    ctx.fillStyle = '#'+color.toString(16).padStart(6,'0');
    ctx.fillRect(0,0,cw,ch);
    // windows
    for(let r=0;r<16;r++){
      for(let c=0;c<8;c++){
        if(Math.random()>0.4){
          const nc = pick(theme.neonColors);
          ctx.fillStyle = '#'+nc.toString(16).padStart(6,'0');
          ctx.globalAlpha = rand(0.3, 0.9);
          ctx.fillRect(c*14+3, r*14+3, 10, 10);
        }
      }
    }
    ctx.globalAlpha = 1;
  });
  const mat = new THREE.MeshStandardMaterial({map:winTex, roughness:0.6, metalness:0.3});
  const b = new THREE.Mesh(geo, mat);
  b.position.set(pos.x, h/2, pos.z);
  b.castShadow = true; b.receiveShadow = true;
  worldGroup.add(b);

  // neon strip on top
  if(Math.random()>0.3){
    const nc = pick(theme.neonColors);
    const strip = new THREE.Mesh(
      new THREE.BoxGeometry(w*1.05, 0.5, d*1.05),
      new THREE.MeshStandardMaterial({color:nc, emissive:nc, emissiveIntensity:1.5})
    );
    strip.position.set(pos.x, h+0.25, pos.z);
    worldGroup.add(strip);
  }
}

function addCactus(pos, theme){
  const g = new THREE.Group();
  const trunkH = rand(3,6);
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3,0.4,trunkH,8),
    new THREE.MeshStandardMaterial({color:0x3a7a3a, roughness:0.8})
  );
  trunk.position.y = trunkH/2;
  trunk.castShadow = true;
  g.add(trunk);
  // arms
  if(Math.random()>0.4){
    const arm = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2,0.25,rand(1.5,2.5),8),
      new THREE.MeshStandardMaterial({color:0x3a7a3a, roughness:0.8})
    );
    arm.position.set(0.5, trunkH*0.6, 0);
    arm.rotation.z = -0.5;
    arm.castShadow = true;
    g.add(arm);
  }
  g.position.set(pos.x, 0, pos.z);
  worldGroup.add(g);
}

function addRock(pos, theme){
  const r = rand(1.5, 4);
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(r, 0),
    new THREE.MeshStandardMaterial({color:0x8a5a3a, roughness:1, flatShading:true})
  );
  rock.position.set(pos.x, r*0.5, pos.z);
  rock.rotation.set(rand(0,3),rand(0,3),rand(0,3));
  rock.castShadow = true;
  worldGroup.add(rock);
}

function addCloud(pos, theme){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:1, transparent:true, opacity:0.85});
  for(let i=0;i<4;i++){
    const s = rand(2,5);
    const c = new THREE.Mesh(new THREE.SphereGeometry(s, 10, 8), mat);
    c.position.set(rand(-4,4), rand(-1,1), rand(-4,4));
    g.add(c);
  }
  g.position.set(pos.x, rand(15,30), pos.z);
  worldGroup.add(g);
}

function addTree(pos, theme){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.3,3,6),
    new THREE.MeshStandardMaterial({color:0x6a4a2a, roughness:0.9})
  );
  trunk.position.y = 1.5;
  trunk.castShadow = true;
  g.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(2, 10, 8),
    new THREE.MeshStandardMaterial({color:0x4a9a4a, roughness:0.8, flatShading:true})
  );
  leaves.position.y = 4;
  leaves.castShadow = true;
  g.add(leaves);
  g.position.set(pos.x, 0, pos.z);
  worldGroup.add(g);
}

function addCitySkyline(){
  // distant buildings around the whole track area
  for(let i=0;i<40;i++){
    const angle = (i/40)*Math.PI*2;
    const r = rand(180, 280);
    const cx = Math.cos(angle)*r;
    const cz = Math.sin(angle)*r;
    const h = rand(40, 100);
    const w = rand(12, 25);
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, w),
      new THREE.MeshStandardMaterial({
        color: pick(currentTheme.buildingColors),
        roughness:0.5, metalness:0.4,
        emissive: pick(currentTheme.neonColors),
        emissiveIntensity: 0.1
      })
    );
    b.position.set(cx, h/2, cz);
    worldGroup.add(b);
  }
}

function addMesas(){
  for(let i=0;i<15;i++){
    const angle = (i/15)*Math.PI*2;
    const r = rand(150, 250);
    const cx = Math.cos(angle)*r;
    const cz = Math.sin(angle)*r;
    const h = rand(20, 50);
    const w = rand(30, 60);
    const mesa = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, w),
      new THREE.MeshStandardMaterial({color:0xb8743a, roughness:1, flatShading:true})
    );
    mesa.position.set(cx, h/2, cz);
    worldGroup.add(mesa);
    // top cap
    const cap = new THREE.Mesh(
      new THREE.BoxGeometry(w*1.1, 2, w*1.1),
      new THREE.MeshStandardMaterial({color:0xd49a5a, roughness:1})
    );
    cap.position.set(cx, h+1, cz);
    worldGroup.add(cap);
  }
}

function addFloatingIslands(){
  for(let i=0;i<12;i++){
    const angle = (i/12)*Math.PI*2;
    const r = rand(120, 200);
    const cx = Math.cos(angle)*r;
    const cz = Math.sin(angle)*r;
    const y = rand(20, 50);
    const size = rand(15, 30);
    const island = new THREE.Group();
    // top grass
    const top = new THREE.Mesh(
      new THREE.CylinderGeometry(size, size*0.8, 4, 12),
      new THREE.MeshStandardMaterial({color:0x66bb44, roughness:1})
    );
    top.position.y = 0;
    island.add(top);
    // bottom cone
    const bot = new THREE.Mesh(
      new THREE.ConeGeometry(size*0.8, size*1.5, 12),
      new THREE.MeshStandardMaterial({color:0x8a6a4a, roughness:1, flatShading:true})
    );
    bot.position.y = -size*0.9;
    bot.rotation.x = Math.PI;
    island.add(bot);
    // tree on island
    const t = new THREE.Mesh(
      new THREE.SphereGeometry(4, 8, 6),
      new THREE.MeshStandardMaterial({color:0x4a9a4a, flatShading:true})
    );
    t.position.y = 5;
    island.add(t);
    island.position.set(cx, y, cz);
    worldGroup.add(island);
  }
}

// ===================== 车辆建模 (霓虹超跑) =====================
function buildCar(){
  const g = new THREE.Group();
  const theme = currentTheme;
  const accent = theme.accent;

  // body - low wide hypercar
  const bodyMat = new THREE.MeshStandardMaterial({color:0x1a1a2a, roughness:0.25, metalness:0.8});
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 4.6), bodyMat);
  body.position.y = 0.55;
  body.castShadow = true;
  g.add(body);

  // front nose (tapered)
  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 1.2), bodyMat);
  nose.position.set(0, 0.42, 2.6);
  nose.castShadow = true;
  g.add(nose);

  // front lip
  const lip = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.12, 0.6),
    new THREE.MeshStandardMaterial({color:accent, emissive:accent, emissiveIntensity:0.8})
  );
  lip.position.set(0, 0.28, 3.0);
  g.add(lip);

  // cabin (glass)
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.55, 1.8),
    new THREE.MeshPhysicalMaterial({color:0x223344, roughness:0.1, metalness:0.2, transmission:0.6, transparent:true, opacity:0.7})
  );
  cabin.position.set(0, 1.05, -0.2);
  g.add(cabin);
  // cabin slope
  const cabinTop = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.35, 1.2),
    cabin.material
  );
  cabinTop.position.set(0, 1.35, -0.4);
  cabinTop.rotation.x = -0.15;
  g.add(cabinTop);

  // rear wing
  const wingStand1 = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.5,0.1), bodyMat);
  wingStand1.position.set(-0.7, 1.1, -2.0);
  g.add(wingStand1);
  const wingStand2 = wingStand1.clone();
  wingStand2.position.x = 0.7;
  g.add(wingStand2);
  const wing = new THREE.Mesh(
    new THREE.BoxGeometry(2.4, 0.12, 0.5),
    new THREE.MeshStandardMaterial({color:accent, emissive:accent, emissiveIntensity:0.6})
  );
  wing.position.set(0, 1.35, -2.0);
  g.add(wing);

  // neon side skirts
  const skirtMat = new THREE.MeshStandardMaterial({color:accent, emissive:accent, emissiveIntensity:1.2});
  const skirtL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 3.5), skirtMat);
  skirtL.position.set(-1.1, 0.35, 0);
  g.add(skirtL);
  const skirtR = skirtL.clone();
  skirtR.position.x = 1.1;
  g.add(skirtR);

  // neon underglow
  const underGlow = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.05, 4.2),
    new THREE.MeshBasicMaterial({color:accent, transparent:true, opacity:0.3})
  );
  underGlow.position.set(0, 0.12, 0);
  g.add(underGlow);

  // headlights (sharp)
  const headMat = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:2});
  const headL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.1), headMat);
  headL.position.set(-0.6, 0.5, 2.95);
  g.add(headL);
  const headR = headL.clone();
  headR.position.x = 0.6;
  g.add(headR);

  // taillights (LED bar)
  const tailMat = new THREE.MeshStandardMaterial({color:accent, emissive:accent, emissiveIntensity:1.5});
  const tail = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.08), tailMat);
  tail.position.set(0, 0.65, -2.3);
  g.add(tail);

  // wheels
  const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.3, 14);
  const wheelMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.7});
  const rimMat = new THREE.MeshStandardMaterial({color:0x888888, metalness:0.9, roughness:0.2, emissive:accent, emissiveIntensity:0.3});
  const wheelPositions = [[-1.0,0.42,1.5],[1.0,0.42,1.5],[-1.0,0.42,-1.5],[1.0,0.42,-1.5]];
  wheelPositions.forEach(([x,y,z])=>{
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.position.set(x,y,z); w.rotation.z = Math.PI/2; w.castShadow = true;
    g.add(w);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.32,8), rimMat);
    rim.position.set(x,y,z); rim.rotation.z = Math.PI/2;
    g.add(rim);
  });

  return g;
}

// ===================== 障碍物 =====================
const OBSTACLE_TYPES = ['cone','banana','pole','pedestrian','oil'];

function spawnObstacles(){
  obstacles = [];
  const count = Math.floor(trackLength / 25);
  for(let i=0;i<count;i++){
    const t = (i+1)/(count+1);
    const p = trackCurve.getPointAt(t);
    const tan = trackCurve.getTangentAt(t);
    const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    const offset = rand(-CFG.trackWidth*0.7, CFG.trackWidth*0.7);
    const pos = p.clone().add(normal.multiplyScalar(offset));
    const type = pick(OBSTACLE_TYPES);
    const mesh = createObstacleMesh(type);
    mesh.position.copy(pos);
    mesh.position.y = getObstacleY(type);
    worldGroup.add(mesh);
    obstacles.push({type, pos: mesh.position, mesh, radius: getObstacleRadius(type), active:true});
  }
}

function createObstacleMesh(type){
  const theme = currentTheme;
  if(type==='cone'){
    const g = new THREE.Group();
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.35, 0.8, 10),
      new THREE.MeshStandardMaterial({color:0xff6622, emissive:0xff4400, emissiveIntensity:0.3})
    );
    g.add(cone);
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(0.7,0.1,0.7),
      new THREE.MeshStandardMaterial({color:0x333333})
    );
    base.position.y = -0.4;
    g.add(base);
    return g;
  }
  if(type==='banana'){
    const g = new THREE.Group();
    const banana = new THREE.Mesh(
      new THREE.TorusGeometry(0.4, 0.1, 8, 16, Math.PI),
      new THREE.MeshStandardMaterial({color:0xffdd33, roughness:0.5})
    );
    banana.rotation.x = Math.PI/2;
    banana.rotation.z = Math.PI/4;
    g.add(banana);
    return g;
  }
  if(type==='pole'){
    const g = new THREE.Group();
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.15, 6, 8),
      new THREE.MeshStandardMaterial({color:0x666666, roughness:0.6, metalness:0.5})
    );
    pole.position.y = 3;
    g.add(pole);
    // crossarm
    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.1, 0.1),
      new THREE.MeshStandardMaterial({color:0x555555})
    );
    arm.position.set(0.5, 5.5, 0);
    g.add(arm);
    // light
    const light = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 8, 8),
      new THREE.MeshStandardMaterial({color:theme.accent, emissive:theme.accent, emissiveIntensity:2})
    );
    light.position.set(1.3, 5.5, 0);
    g.add(light);
    return g;
  }
  if(type==='pedestrian'){
    const g = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.25, 0.8, 4, 8),
      new THREE.MeshStandardMaterial({color:pick([0xff4444,0x4488ff,0x44ff88,0xffaa44]), roughness:0.7})
    );
    body.position.y = 1.0;
    g.add(body);
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 10, 10),
      new THREE.MeshStandardMaterial({color:0xeebb99, roughness:0.6})
    );
    head.position.y = 1.65;
    g.add(head);
    return g;
  }
  if(type==='oil'){
    return new THREE.Mesh(
      new THREE.CircleGeometry(1.2, 20),
      new THREE.MeshStandardMaterial({color:0x111122, roughness:0.2, metalness:0.6, transparent:true, opacity:0.8})
    );
  }
  return new THREE.Mesh();
}

function getObstacleY(type){
  if(type==='oil') return 0.02;
  if(type==='banana') return 0.1;
  return 0;
}
function getObstacleRadius(type){
  if(type==='oil') return 1.2;
  if(type==='banana') return 0.5;
  if(type==='pedestrian') return 0.6;
  if(type==='pole') return 0.5;
  return 0.6;
}

// ===================== AI 车辆 =====================
function spawnAI(){
  aiCars = [];
  const colors = [0xff3c8a, 0x39ff14, 0xffaa00, 0xb066ff];
  for(let i=0;i<3;i++){
    const aiCar = buildCar();
    // tint body
    aiCar.children[0].material.color.setHex(colors[i]);
    aiCar.position.copy(trackCurve.getPointAt(0.05*(i+1)));
    aiCar.position.y = 0.3;
    worldGroup.add(aiCar);
    aiCars.push({
      mesh: aiCar,
      t: 0.05*(i+1),
      speed: rand(0.25, 0.35),
      offset: rand(-3, 3),
      color: colors[i]
    });
  }
}

// ===================== 游戏逻辑 =====================
function startRace(themeKey){
  const theme = MAP_THEMES[themeKey];
  applyTheme(theme);
  generateTrack(themeKey);
  buildTrack();
  buildScenery();

  // player car
  car = buildCar();
  const startPos = trackCurve.getPointAt(0);
  car.position.copy(startPos);
  car.position.y = 0.3;
  const startTan = trackCurve.getTangentAt(0);
  car.rotation.y = Math.atan2(startTan.x, startTan.z);
  scene.add(car);

  carPos = car.position.clone();
  carVel = new THREE.Vector3();
  carHeading = car.rotation.y;
  carSteer = 0;

  spawnObstacles();
  spawnAI();

  distance = 0;
  raceTime = 0;
  maxSpeedReached = 0;
  trackProgress = 0;
  gameState = 'countdown';

  document.getElementById('hud').classList.add('active');
  document.getElementById('menu').classList.remove('active');
  document.getElementById('result').classList.remove('active');

  // countdown
  let n = 3;
  const cdEl = document.getElementById('cd-num');
  const cdDiv = document.getElementById('countdown');
  cdDiv.classList.add('active');
  cdEl.textContent = n;
  const cdInt = setInterval(()=>{
    n--;
    if(n>0){ cdEl.textContent = n; cdEl.style.animation='none'; void cdEl.offsetWidth; cdEl.style.animation='pop .8s ease-out'; }
    else if(n===0){ cdEl.textContent = 'GO!'; cdEl.style.color='#'+theme.accent.toString(16).padStart(6,'0'); }
    else {
      clearInterval(cdInt);
      cdDiv.classList.remove('active');
      gameState = 'racing';
      startMusic(themeKey);
    }
  }, 900);

  if('ontouchstart' in window) document.getElementById('touch').classList.add('active');
}

function updatePhysics(dt){
  if(gameState!=='racing') return;

  const speed = carVel.length();
  const steerFactor = THREE.MathUtils.lerp(CFG.steerMax, CFG.highSpeedSteer, Math.min(speed/CFG.maxSpeed,1));

  if(input.left) carSteer = THREE.MathUtils.lerp(carSteer, steerFactor, CFG.steerSpeed*dt);
  else if(input.right) carSteer = THREE.MathUtils.lerp(carSteer, -steerFactor, CFG.steerSpeed*dt);
  else carSteer = THREE.MathUtils.lerp(carSteer, 0, CFG.steerSpeed*dt);

  // turn
  carHeading += carSteer * (0.6 + speed*0.02) * dt;

  // forward dir
  const fwd = new THREE.Vector3(Math.sin(carHeading), 0, Math.cos(carHeading));

  if(input.gas) carVel.addScaledVector(fwd, CFG.gas*dt*60);
  if(input.brake) carVel.multiplyScalar(Math.max(0, 1-CFG.brakeForce*dt));

  // friction
  carVel.multiplyScalar(1 - CFG.friction*dt);

  // speed cap
  if(carVel.length()>CFG.maxSpeed) carVel.setLength(CFG.maxSpeed);

  const curSpeed = carVel.length();
  if(curSpeed > maxSpeedReached) maxSpeedReached = curSpeed;

  // sub-step movement for collision
  const steps = Math.max(1, Math.ceil(curSpeed*dt / CFG.subStepMax));
  const sdt = dt/steps;

  for(let s=0;s<steps;s++){
    carPos.addScaledVector(carVel, sdt);

    // get nearest track point
    const nearT = findNearestT(carPos);
    const trackP = trackCurve.getPointAt(nearT);
    const trackTan = trackCurve.getTangentAt(nearT);
    const trackNormal = new THREE.Vector3(-trackTan.z, 0, trackTan.x).normalize();
    const toCar = carPos.clone().sub(trackP);
    const lateral = toCar.dot(trackNormal);

    // barrier collision
    const limit = CFG.trackWidth + 0.5;
    if(Math.abs(lateral) > limit){
      const push = (Math.abs(lateral)-limit)*0.5 + 0.3;
      carPos.addScaledVector(trackNormal, -Math.sign(lateral)*push);
      carVel.multiplyScalar(0.6);
    }

    // follow track height
    carPos.y = trackP.y + 0.3;

    // obstacle collision
    for(const obs of obstacles){
      if(!obs.active) continue;
      const dx = carPos.x - obs.pos.x;
      const dz = carPos.z - obs.pos.z;
      const dist = Math.sqrt(dx*dx+dz*dz);
      if(dist < obs.radius + 1.0){
        handleObstacle(obs, fwd);
      }
    }
  }

  car.position.copy(carPos);
  car.rotation.y = carHeading;
  // tilt on turn
  car.rotation.z = THREE.MathUtils.lerp(car.rotation.z, -carSteer*0.1, 0.1);

  // distance/progress
  const nearT = findNearestT(carPos);
  trackProgress = nearT;
  distance = Math.floor(nearT * trackLength);

  // check finish
  if(nearT >= 0.99){
    finishRace();
  }
}

function handleObstacle(obs, fwd){
  if(obs.type==='banana'){
    // spin out
    carHeading += rand(-1, 1);
    carVel.multiplyScalar(0.5);
    obs.active = false;
    obs.mesh.visible = false;
  } else if(obs.type==='oil'){
    // slide - reduce steering, drift
    carVel.multiplyScalar(0.85);
    carHeading += (Math.random()-0.5)*0.5;
  } else if(obs.type==='pedestrian'){
    // slow down, time penalty
    carVel.multiplyScalar(0.3);
    obs.active = false;
    obs.mesh.visible = false;
    raceTime += 3;
  } else {
    // cone / pole - hard hit
    const dx = carPos.x - obs.pos.x;
    const dz = carPos.z - obs.pos.z;
    const d = Math.sqrt(dx*dx+dz*dz) || 1;
    carVel.x += (dx/d)*15;
    carVel.z += (dz/d)*15;
    carVel.multiplyScalar(0.4);
    if(obs.type==='pole'){
      obs.active = false;
      obs.mesh.visible = false;
    }
  }
}

function findNearestT(pos){
  // approximate using cached samples
  let bestT = trackProgress;
  let bestDist = Infinity;
  const range = 0.08;
  const steps = 40;
  const start = Math.max(0, bestT-range);
  const end = Math.min(1, bestT+range);
  for(let i=0;i<=steps;i++){
    const t = start + (end-start)*i/steps;
    const p = trackCurve.getPointAt(t);
    const d = (p.x-pos.x)**2 + (p.z-pos.z)**2;
    if(d<bestDist){bestDist=d;bestT=t}
  }
  return bestT;
}

function updateAI(dt){
  for(const ai of aiCars){
    ai.t += ai.speed*dt;
    if(ai.t>=1) ai.t = 0;
    const p = trackCurve.getPointAt(ai.t);
    const tan = trackCurve.getTangentAt(ai.t);
    const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    ai.mesh.position.set(p.x+normal.x*ai.offset, p.y+0.3, p.z+normal.z*ai.offset);
    ai.mesh.rotation.y = Math.atan2(tan.x, tan.z);
  }
}

function updateCamera(dt){
  if(!car) return;
  const fwd = new THREE.Vector3(Math.sin(carHeading), 0, Math.cos(carHeading));

  if(cameraMode===3){
    // third person chase
    const target = carPos.clone().addScaledVector(fwd, -10);
    target.y += 5;
    camera.position.lerp(target, 0.1);
    const lookAt = carPos.clone().addScaledVector(fwd, 5);
    lookAt.y += 1;
    camera.lookAt(lookAt);
  } else {
    // first person cockpit
    const target = carPos.clone().addScaledVector(fwd, 0.5);
    target.y += 1.4;
    camera.position.lerp(target, 0.3);
    const lookAt = carPos.clone().addScaledVector(fwd, 10);
    lookAt.y += 1.2;
    camera.lookAt(lookAt);
  }
}

function updateHUD(){
  const speed = carVel ? Math.floor(carVel.length()*3.6) : 0;
  document.getElementById('speed-val').textContent = speed;
  document.getElementById('dist').textContent = distance;
  document.getElementById('timer').textContent = raceTime.toFixed(1);
  document.getElementById('progress').textContent = Math.floor(trackProgress*100)+'%';
  document.getElementById('best').textContent = bestTimes[currentTheme?.name] || '--';

  // minimap
  drawMinimap();
}

function drawMinimap(){
  const canvas = document.getElementById('mm');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = 'rgba(0,10,20,0.8)';
  ctx.fillRect(0,0,w,h);

  // track bounds
  const pts = trackCurve.getSpacedPoints(100);
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z)});
  const scale = Math.min(w/(maxX-minX), h/(maxZ-minZ))*0.85;
  const ox = (w-(maxX-minX)*scale)/2 - minX*scale;
  const oz = (h-(maxZ-minZ)*scale)/2 - minZ*scale;

  ctx.strokeStyle = '#'+currentTheme.accent.toString(16).padStart(6,'0');
  ctx.lineWidth = 4;
  ctx.beginPath();
  pts.forEach((p,i)=>{
    const x=p.x*scale+ox, y=p.z*scale+oz;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // obstacles
  ctx.fillStyle = '#ff4444';
  obstacles.forEach(o=>{
    if(!o.active) return;
    ctx.beginPath();
    ctx.arc(o.pos.x*scale+ox, o.pos.z*scale+oz, 2, 0, Math.PI*2);
    ctx.fill();
  });

  // player
  ctx.fillStyle = '#00ff88';
  ctx.beginPath();
  ctx.arc(carPos.x*scale+ox, carPos.z*scale+oz, 4, 0, Math.PI*2);
  ctx.fill();

  // finish
  const fp = trackCurve.getPointAt(0.99);
  ctx.fillStyle = '#ffff00';
  ctx.fillRect(fp.x*scale+ox-3, fp.z*scale+oz-3, 6, 6);
}

function finishRace(){
  gameState = 'finished';
  stopMusic();
  const themeName = currentTheme.name;
  const prevBest = bestTimes[themeName];
  if(!prevBest || raceTime < parseFloat(prevBest)){
    bestTimes[themeName] = raceTime.toFixed(1);
  }
  document.getElementById('r-dist').textContent = distance + ' m';
  document.getElementById('r-time').textContent = raceTime.toFixed(1) + ' s';
  document.getElementById('r-speed').textContent = Math.floor(maxSpeedReached*3.6) + ' km/h';
  document.getElementById('res-title').textContent = '完赛!';
  document.getElementById('res-sub').textContent = '新纪录!';
  document.getElementById('result').classList.add('active');
}

// ===================== 主循环 =====================
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(gameState==='racing'){
    raceTime += dt;
    updatePhysics(dt);
    updateAI(dt);
    updateHUD();
  }
  if(car) updateCamera(dt);

  renderer.render(scene, camera);
}

// ===================== 输入 =====================
function setupInput(){
  window.addEventListener('keydown', e=>{
    if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft') input.left=true;
    if(e.key==='d'||e.key==='D'||e.key==='ArrowRight') input.right=true;
    if(e.key==='w'||e.key==='W'||e.key==='ArrowUp') input.gas=true;
    if(e.key==='s'||e.key==='S'||e.key==='ArrowDown') input.brake=true;
    if(e.key==='c'||e.key==='C') toggleCamera();
  });
  window.addEventListener('keyup', e=>{
    if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft') input.left=false;
    if(e.key==='d'||e.key==='D'||e.key==='ArrowRight') input.right=false;
    if(e.key==='w'||e.key==='W'||e.key==='ArrowUp') input.gas=true;
    if(e.key==='s'||e.key==='S'||e.key==='ArrowDown') input.brake=false;
  });

  // touch
  document.querySelectorAll('.t-btn').forEach(btn=>{
    const k = btn.dataset.k;
    const on = e=>{e.preventDefault(); input[k]=true};
    const off = e=>{e.preventDefault(); input[k]=false};
    btn.addEventListener('touchstart', on, {passive:false});
    btn.addEventListener('touchend', off, {passive:false});
    btn.addEventListener('touchcancel', off, {passive:false});
  });
}

function toggleCamera(){
  cameraMode = cameraMode===3 ? 1 : 3;
  document.getElementById('cam-btn').textContent = cameraMode===1 ? '视角: 车内 [C]' : '视角: 追尾 [C]';
}

// ===================== 菜单 =====================
let selectedMap = null;

function buildMenu(){
  const grid = document.getElementById('map-grid');
  grid.innerHTML = '';
  Object.entries(MAP_THEMES).forEach(([key, theme])=>{
    const wrap = document.createElement('div');
    wrap.className = 'map-card-wrap';
    wrap.innerHTML = `
      <div class="map-thumb" style="background:linear-gradient(135deg, #${theme.sky.toString(16).padStart(6,'0')}, #${theme.accent.toString(16).padStart(6,'0')})">${theme.icon}</div>
      <div class="map-info"><h3>${theme.name}</h3><p>${theme.desc}</p></div>
    `;
    wrap.onclick = ()=>{
      document.querySelectorAll('.map-card-wrap').forEach(c=>c.classList.remove('selected'));
      wrap.classList.add('selected');
      selectedMap = key;
      document.getElementById('start-btn').disabled = false;
    };
    grid.appendChild(wrap);
  });

  document.getElementById('start-btn').onclick = ()=>{ if(selectedMap) startRace(selectedMap); };
  document.getElementById('retry-btn').onclick = ()=>{ if(selectedMap) startRace(selectedMap); };
  document.getElementById('menu-btn').onclick = ()=>{
    document.getElementById('result').classList.remove('active');
    document.getElementById('menu').classList.add('active');
    document.getElementById('hud').classList.remove('active');
    gameState = 'menu';
    stopMusic();
  };
  document.getElementById('cam-btn').onclick = toggleCamera;
  document.getElementById('music-btn').onclick = toggleMusic;
}

function toggleMusic(){
  musicOn = !musicOn;
  document.getElementById('music-btn').textContent = musicOn ? '♪ 音乐 开' : '♪ 音乐 关';
  if(gameState==='racing'){
    if(musicOn) startMusic(selectedMap);
    else stopMusic();
  }
}

// ===================== 启动 =====================
initScene();
setupInput();
buildMenu();
animate();
</script>
