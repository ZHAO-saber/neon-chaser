<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>NEON CHASER · 霓虹追逐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#hud.active{display:block}
.top-bar{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 24px}
.info-card{background:rgba(5,10,20,.6);border:1px solid rgba(0,220,255,.3);border-radius:10px;padding:7px 14px;backdrop-filter:blur(6px)}
.info-card .label{font-size:10px;letter-spacing:2px;color:#7ad9e8;opacity:.85}
.info-card .value{font-size:20px;font-weight:700;color:#eaffff}
.info-card .value .unit{font-size:11px;color:#7ad9e8;margin-left:3px;font-weight:400}

.speedo{position:absolute;bottom:22px;right:26px;width:140px;height:140px;background:rgba(5,10,20,.6);border:2px solid rgba(0,220,255,.5);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,220,255,.25),inset 0 0 20px rgba(0,220,255,.1)}
.speedo #speed-val{font-size:38px;font-weight:800;color:#eaffff;text-shadow:0 0 12px rgba(0,220,255,.7);line-height:1}
.speedo #speed-unit{font-size:12px;color:#7ad9e8;margin-top:2px}

.lap-info{position:absolute;bottom:26px;left:26px}
.lap-info .row{display:flex;gap:10px;margin-bottom:3px}
.lap-info .tag{color:#7ad9e8;font-size:11px;width:60px}
.lap-info .num{color:#eaffff;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

.minimap{position:absolute;top:64px;left:24px;width:130px;height:130px;background:rgba(5,10,20,.6);border:1px solid rgba(0,220,255,.4);border-radius:8px;overflow:hidden}
.minimap canvas{width:100%;height:100%}

.hud-btn{position:absolute;pointer-events:auto;background:rgba(5,10,20,.6);border:1px solid rgba(0,220,255,.4);border-radius:8px;color:#eaffff;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(4px);transition:all .15s}
.hud-btn:hover{background:rgba(0,220,255,.2);box-shadow:0 0 14px rgba(0,220,255,.4)}
#cam-btn{top:14px;left:50%;transform:translateX(-50%)}
#music-btn{top:14px;left:calc(50% + 70px)}
#pause-btn{top:14px;left:calc(50% - 130px)}

.overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(8,12,28,.92),rgba(0,0,0,.98));display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;padding:20px}
.overlay.active{display:flex}
.overlay h1{font-size:52px;font-weight:900;letter-spacing:8px;background:linear-gradient(90deg,#00dcff,#b066ff,#ff3c8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;text-align:center}
.overlay .sub{color:#7ad9e8;letter-spacing:6px;font-size:13px;margin-bottom:30px;text-align:center}

.map-grid{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:900px;margin-bottom:24px}
.map-card-wrap{width:240px;height:300px;border-radius:14px;overflow:hidden;cursor:pointer;border:2px solid rgba(255,255,255,.15);transition:all .25s}
.map-card-wrap:hover{transform:translateY(-6px);border-color:rgba(0,220,255,.6);box-shadow:0 12px 40px rgba(0,220,255,.3)}
.map-card-wrap.selected{border-color:#00dcff;box-shadow:0 0 30px rgba(0,220,255,.5)}
.map-thumb{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:60px}
.map-info{padding:12px;background:rgba(5,10,20,.8)}
.map-info h3{font-size:16px;margin-bottom:4px}
.map-info p{font-size:11px;color:#9ab;line-height:1.4}

.btn{background:linear-gradient(135deg,#00a8cc,#00dcff);border:none;color:#001018;padding:12px 40px;font-size:16px;font-weight:700;border-radius:8px;cursor:pointer;letter-spacing:2px;transition:transform .15s,box-shadow .15s;margin:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,220,255,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;border:1px solid rgba(0,220,255,.5);color:#7ad9e8}

#countdown{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;pointer-events:none}
#countdown.active{display:flex}
#countdown .num{font-size:150px;font-weight:900;color:#fff;text-shadow:0 0 50px rgba(0,220,255,.9);animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{opacity:1}100%{transform:scale(1.5);opacity:0}}

#touch{position:fixed;inset:0;display:none;z-index:15;pointer-events:none}
#touch.active{display:block}
.t-btn{position:absolute;width:72px;height:72px;border-radius:50%;background:rgba(0,220,255,.15);border:2px solid rgba(0,220,255,.5);color:#eaffff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;backdrop-filter:blur(4px)}
.t-btn:active{background:rgba(0,220,255,.4)}
.t-left{left:20px;bottom:110px}
.t-right{left:108px;bottom:110px}
.t-gas{right:20px;bottom:110px}
.t-brake{right:108px;bottom:30px}

.result-row{display:flex;justify-content:space-between;padding:5px 0;color:#b8d4e0;font-size:14px}
.result-row .v{color:#eaffff;font-weight:600;font-variant-numeric:tabular-nums}
</style>

<body>

  <div class="top-bar">
    <div class="info-card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0</span><span class="unit">m</span></div></div>

    <button class="btn ghost" id="menu-btn">换地图</button>

</div>

<div id="touch">
  <div class="t-btn t-left" data-k="left">◀</div>
  <div class="t-btn t-right" data-k="right">▶</div>

</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","cannon":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon';

// ===================== 配置 =====================
const CFG = {
  carMass: 1200,
  engineForce: 8500,       // 提升加速感，终端速度约 200km/h
  brakeForce: 8000,
  maxSteer: 0.55,
  steerSpeed: 4.2,
  linearDamping: 0.12,     // 降低阻尼，否则车速上不去
  angularDamping: 0.6,
  trackWidth: 10,
  maxSpeed: 80,            // m/s 上限 ~288km/h
  downForce: 1.0,          // 下压力系数，防飞天
};
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

const MAP_THEMES = {
  neon: {
    name:'霓虹都市', icon:'🌃', desc:'夜之城赛道，霓虹摩天楼',
    sky:0x1a1a3e, fog:0x1a1a3e, fogDensity:0.006,
    ground:0x2a2a3a, road:0x3a3a4e, roadLine:0x00dcff,
    curbA:0xff2255, curbB:0xffffff, accent:0x00dcff,
    sun:0x8899ff, sunIntensity:0.8, ambient:0x6688cc, ambientIntensity:0.9,
    buildingColors:[0x2a2a4a,0x3a2a4a,0x2a3a5a,0x4a2a3a],
    neonColors:[0x00dcff,0xff3c8a,0xb066ff,0x39ff14,0xffaa00],
    groundFriction:0.6,
  },
  desert: {
    name:'沙漠夕阳', icon:'🏜️', desc:'戈壁红岩仙人掌夕阳',
    sky:0xff8844, fog:0xffaa66, fogDensity:0.008,
    ground:0xd4a574, road:0x8a6a4a, roadLine:0xffffff,
    curbA:0xcc3333, curbB:0xf0e0c0, accent:0xff6622,
    sun:0xffcc66, sunIntensity:1.4, ambient:0xff9955, ambientIntensity:0.6,
    buildingColors:[0xb8865a,0xa06a40,0xc49a6a,0x8a5a3a],
    neonColors:[0xff6622,0xffcc44,0xff4422],
    groundFriction:0.35,
  },
  sky: {
    name:'天空浮岛', icon:'☁️', desc:'云端浮岛瀑布彩虹高空',
    sky:0x88ccff, fog:0xaaddff, fogDensity:0.006,
    ground:0x66bb44, road:0xeeeeff, roadLine:0x6688ff,
    curbA:0x66aaff, curbB:0xffffff, accent:0x66aaff,
    sun:0xffffee, sunIntensity:1.2, ambient:0xaaccff, ambientIntensity:0.7,
    buildingColors:[0xddccff,0xffeedd,0xccddee,0xeeddff],
    neonColors:[0x66aaff,0xff88cc,0x88ffcc],
    groundFriction:0.5,
  },
};

// ===================== 全局状态 =====================
let scene, camera, renderer, clock;
let world; // cannon world
let carBody, carMesh;
let currentTheme = null, currentThemeKey = null;
let trackPoints = [], trackCurve = null, trackLength = 0;
let trackHeightSamples = []; // 预计算赛道高度，用于地面跟随防穿模
let worldGroup = null;
let obstacles = [], aiCars = [];
let gameState = 'menu';
let distance = 0, raceTime = 0, maxSpeedReached = 0;
let cameraMode = 3, trackProgress = 0;
let bestTimes = {};
let input = { left:false, right:false, gas:true, brake:false };
let audioCtx = null, musicNodes = null, musicOn = true;
let engineSound = null;
let particleSystems = [];
let sceneryMeshes = []; // for LOD culling
let wallBodies = []; // track physics walls

// ===================== 工具 =====================
function rand(a,b){return a+Math.random()*(b-a)}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function makeCanvasTexture(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

// ===================== 场景初始化 =====================
function initScene(){
  scene = new THREE.Scene();
  clock = new THREE.Clock();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1500);
  try {
    renderer = new THREE.WebGLRenderer({antialias:!IS_MOBILE, powerPreference:'high-performance'});
  } catch(e){
    console.error('WebGL 不可用:', e.message);
    // 不覆盖 body，让菜单仍可显示
    return;
  }
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(IS_MOBILE ? 1 : Math.min(devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  addEventListener('resize', onResize);
}
function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

// ===================== Cannon 物理世界 =====================
function initPhysics(){
  world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.allowSleep = true;
  world.defaultContactMaterial.friction = 0.5;
  world.defaultContactMaterial.restitution = 0.1;

  // 极低安全网，防止意外坠落虚空（赛道地面由高度钳制处理）
  const groundBody = new CANNON.Body({ mass:0, shape:new CANNON.Plane() });
  groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
  groundBody.position.y = -200;
  world.addBody(groundBody);
}

function applyTheme(theme){
  currentTheme = theme;
  scene.background = new THREE.Color(theme.sky);
  scene.fog = new THREE.FogExp2(theme.fog, theme.fogDensity);
  scene.children.forEach(c=>{ if(c.isLight) scene.remove(c) });
  scene.add(new THREE.AmbientLight(theme.ambient, theme.ambientIntensity));
  const sun = new THREE.DirectionalLight(theme.sun, theme.sunIntensity);
  sun.position.set(50,100,30);
  sun.castShadow = true;
  const shadowSize = IS_MOBILE ? 512 : 1024;
  sun.shadow.mapSize.set(shadowSize, shadowSize);
  sun.shadow.camera.left=-80;sun.shadow.camera.right=80;
  sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;
  sun.shadow.camera.far=250;
  sun.shadow.bias = -0.0008;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(theme.accent, 0.5);
  rim.position.set(-30,50,-30); scene.add(rim);
  scene.add(new THREE.HemisphereLight(theme.sky, theme.ground, 0.6));
}

// ===================== 赛道生成 (不变) =====================
function generateTrack(themeKey){
  trackPoints = [];
  const segs = 14;
  let x=0, z=0, angle=0;
  for(let i=0;i<=segs;i++){
    const yOff = themeKey==='sky' ? Math.sin(i*0.8)*8 + i*3 : (themeKey==='desert'? Math.sin(i*0.5)*2 : Math.sin(i*0.6)*3);
    trackPoints.push(new THREE.Vector3(x, yOff, z));
    if(i<segs){
      angle += (Math.random()-0.5)*0.6;
      const len = rand(40, 70);
      x += Math.sin(angle)*len;
      z += Math.cos(angle)*len;
    }
  }
  trackCurve = new THREE.CatmullRomCurve3(trackPoints, false, 'catmullrom', 0.5);
  trackLength = trackCurve.getLength();
  // 预计算赛道高度采样（每 0.5m 一个点），用于物理地面跟随，防穿模飞天
  trackHeightSamples = [];
  const samples = Math.max(200, Math.floor(trackLength * 2));
  for(let i=0;i<=samples;i++){
    const t = i/samples;
    const p = trackCurve.getPointAt(t);
    trackHeightSamples.push({t, x:p.x, y:p.y, z:p.z});
  }
}

// 根据世界坐标(x,z)查赛道最近高度
function getTrackHeightAt(x, z){
  if(!trackHeightSamples.length) return 0;
  // 从当前进度附近搜索，减少计算
  let bestY = 0, bestD = Infinity;
  const startT = trackProgress;
  const range = 0.08;
  const start = Math.max(0, Math.floor((startT-range)*trackHeightSamples.length));
  const end = Math.min(trackHeightSamples.length, Math.ceil((startT+range)*trackHeightSamples.length));
  for(let i=start;i<end;i++){
    const s = trackHeightSamples[i];
    const dx = s.x-x, dz = s.z-z;
    const d = dx*dx+dz*dz;
    if(d < bestD){ bestD = d; bestY = s.y; }
  }
  return bestY;
}

// ===================== 赛道渲染 =====================
function buildTrack(){
  if(worldGroup) scene.remove(worldGroup);
  // 清理旧赛道墙
  wallBodies.forEach(b=>world.removeBody(b));
  wallBodies = [];
  worldGroup = new THREE.Group();
  scene.add(worldGroup);

  const theme = currentTheme;
  const divisions = Math.floor(trackLength * 1.5);
  const points = trackCurve.getSpacedPoints(divisions);
  const tangents = [];
  for(let i=0;i<=divisions;i++) tangents.push(trackCurve.getTangentAt(i/divisions));

  // road
  const roadGeo = new THREE.BufferGeometry();
  const verts=[], uvs=[], hw=CFG.trackWidth;
  for(let i=0;i<=divisions;i++){
    const p=points[i], tan=tangents[i];
    const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    const l=p.clone().add(n.clone().multiplyScalar(hw));
    const r=p.clone().add(n.clone().multiplyScalar(-hw));
    verts.push(l.x,l.y,l.z, r.x,r.y,r.z);
    uvs.push(0, i*0.3, 1, i*0.3);
  }
  const idx=[];
  for(let i=0;i<divisions;i++){const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3;idx.push(a,b,c,b,d,c)}
  roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
  roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  roadGeo.setIndex(idx); roadGeo.computeVertexNormals();
  const roadTex = makeCanvasTexture(256,256,(ctx,w,h)=>{
    ctx.fillStyle='#'+theme.road.toString(16).padStart(6,'0');
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='#'+theme.roadLine.toString(16).padStart(6,'0');
    ctx.lineWidth=10; ctx.setLineDash([24,18]);
    ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(10,h);ctx.moveTo(w-10,0);ctx.lineTo(w-10,h);ctx.stroke();
    for(let i=0;i<1500;i++){ctx.fillStyle=`rgba(0,0,0,${Math.random()*0.1})`;ctx.fillRect(Math.random()*w,Math.random()*h,2,2)}
  });
  roadTex.wrapS=roadTex.wrapT=THREE.RepeatWrapping;
  const roadMesh = new THREE.Mesh(roadGeo, new THREE.MeshStandardMaterial({map:roadTex, roughness:0.85, metalness:0.1}));
  roadMesh.receiveShadow = true;
  worldGroup.add(roadMesh);

  // curbs
  for(let side=-1; side<=1; side+=2){
    const cg=new THREE.BufferGeometry(); const cv=[], ci=[];
    for(let i=0;i<=divisions;i++){
      const p=points[i], tan=tangents[i];
      const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
      const inn=p.clone().add(n.clone().multiplyScalar(hw*side));
      const out=p.clone().add(n.clone().multiplyScalar((hw+1.2)*side));
      inn.y+=0.15; out.y+=0.15;
      cv.push(inn.x,inn.y,inn.z, out.x,out.y,out.z);
    }
    for(let i=0;i<divisions;i++){const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3;ci.push(a,b,c,b,d,c)}
    cg.setAttribute('position', new THREE.Float32BufferAttribute(cv,3));
    cg.setIndex(ci); cg.computeVertexNormals();
    const ct = makeCanvasTexture(64,256,(ctx,w,h)=>{
      for(let r=0;r<8;r++){ctx.fillStyle=r%2===0?'#'+theme.curbA.toString(16).padStart(6,'0'):'#'+theme.curbB.toString(16).padStart(6,'0');ctx.fillRect(0,r*h/8,w,h/8)}
    });
    ct.wrapT=THREE.RepeatWrapping;
    worldGroup.add(new THREE.Mesh(cg, new THREE.MeshStandardMaterial({map:ct, roughness:0.7})));
  }

  // ground
  const groundTex = makeCanvasTexture(512,512,(ctx,w,h)=>{
    ctx.fillStyle='#'+theme.ground.toString(16).padStart(6,'0');ctx.fillRect(0,0,w,h);
    for(let i=0;i<3000;i++){ctx.fillStyle=`rgba(0,0,0,${Math.random()*0.08})`;ctx.fillRect(Math.random()*w,Math.random()*h,3,3)}
  });
  groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping; groundTex.repeat.set(20,20);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000,2000), new THREE.MeshStandardMaterial({map:groundTex, roughness:1}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-0.05; ground.receiveShadow=true;
  worldGroup.add(ground);

  // physics track walls
  buildTrackWalls(points, tangents);
  // tire barriers (visual only, walls handle collision)
  buildTireBarriers(points, tangents);
}

function buildTrackWalls(points, tangents){
  const hw = CFG.trackWidth + 1.2;
  const step = 2; // 更密集的墙段，防高速穿出
  for(let side=-1; side<=1; side+=2){
    for(let i=0;i<points.length;i+=step){
      const p = points[i];
      const tan = tangents[i];
      const n = new THREE.Vector3(-tan.z,0,tan.x).normalize();
      const wx = p.x + n.x*hw*side;
      const wz = p.z + n.z*hw*side;
      // 墙跟随赛道高度，防止车从低洼处穿出
      const wall = new CANNON.Body({ mass:0, shape:new CANNON.Box(new CANNON.Vec3(1.5, 4, step*1.5)) });
      wall.position.set(wx, p.y + 2, wz);
      const angle = Math.atan2(tan.x, tan.z);
      wall.quaternion.setFromEuler(0, angle, 0);
      world.addBody(wall);
      wallBodies.push(wall);
    }
  }
  // 起点/终点封口墙，防止掉头后从两端飞出
  const endP = points[points.length-1];
  const startP = points[0];
  [startP, endP].forEach((p, idx)=>{
    const tan = tangents[idx===0?0:points.length-1];
    const angle = Math.atan2(tan.x, tan.z);
    const wall = new CANNON.Body({ mass:0, shape:new CANNON.Box(new CANNON.Vec3(hw+2, 4, 1)) });
    wall.position.set(p.x, p.y+2, p.z);
    wall.quaternion.setFromEuler(0, angle+Math.PI/2, 0);
    world.addBody(wall);
    wallBodies.push(wall);
  });
}

function buildTireBarriers(points, tangents){
  const theme = currentTheme;
  const tireGeo = new THREE.CylinderGeometry(0.5,0.5,0.4,8);
  const tireMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.9});
  const stripeMat = new THREE.MeshStandardMaterial({color:theme.curbA, roughness:0.7, emissive:theme.curbA, emissiveIntensity:0.2});
  const step = 3;
  for(let side=-1; side<=1; side+=2){
    for(let i=0;i<points.length;i+=step){
      const p=points[i], tan=tangents[i];
      const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
      const base=p.clone().add(n.clone().multiplyScalar((CFG.trackWidth+2.2)*side));
      for(let s=0;s<3;s++){
        const tire=new THREE.Mesh(tireGeo, s%2===0?tireMat:stripeMat);
        tire.position.set(base.x, 0.2+s*0.4, base.z);
        tire.rotation.z=Math.PI/2;
        worldGroup.add(tire);
      }
    }
  }
}

// ===================== 环境 (InstancedMesh 优化) =====================
function buildScenery(){
  const theme = currentTheme;
  const themeKey = currentThemeKey;
  const pts = trackCurve.getSpacedPoints(50);
  const tans = [];
  for(let i=0;i<=50;i++) tans.push(trackCurve.getTangentAt(i/50));

  // collect instance positions by type
  const instances = {building:[], cactus:[], rock:[], cloud:[], tree:[]};
  for(let i=0;i<pts.length;i++){
    const p=pts[i], tan=tans[i];
    const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    for(let side=-1; side<=1; side+=2){
      for(let d=1; d<=3; d++){
        if(Math.random()>0.55) continue;
        const dist = 14 + d*8 + Math.random()*8;
        const pos = p.clone().add(n.clone().multiplyScalar(dist*side));
        pos.x += rand(-4,4); pos.z += rand(-4,4);
        if(themeKey==='neon') instances.building.push({pos, h:rand(15,50), w:rand(6,14), d:rand(6,14)});
        else if(themeKey==='desert'){ if(Math.random()>0.5) instances.cactus.push({pos, h:rand(3,6)}); else instances.rock.push({pos, r:rand(1.5,4)}); }
        else { if(Math.random()>0.6) instances.cloud.push({pos}); else instances.tree.push({pos}); }
      }
    }
  }

  // build instanced meshes
  if(instances.building.length){
    const mat = new THREE.MeshStandardMaterial({color:0x333344, roughness:0.6, metalness:0.3});
    const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), mat, instances.building.length);
    const dummy = new THREE.Object3D();
    instances.building.forEach((b,i)=>{
      dummy.position.set(b.pos.x, b.h/2, b.pos.z);
      dummy.scale.set(b.w, b.h, b.d);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
      // window emissive via color tint
      inst.setColorAt(i, new THREE.Color(pick(theme.buildingColors)));
    });
    inst.castShadow = true; inst.receiveShadow = true;
    worldGroup.add(inst);
    sceneryMeshes.push(inst);

    // neon strips on top of some buildings
    const stripMat = new THREE.MeshStandardMaterial({color:theme.accent, emissive:theme.accent, emissiveIntensity:1.5});
    const stripGeo = new THREE.BoxGeometry(1,0.4,1);
    const stripInst = new THREE.InstancedMesh(stripGeo, stripMat, instances.building.length);
    let si=0;
    instances.building.forEach((b)=>{
      if(Math.random()>0.4) return;
      dummy.position.set(b.pos.x, b.h+0.2, b.pos.z);
      dummy.scale.set(b.w*1.05, 1, b.d*1.05);
      dummy.updateMatrix();
      stripInst.setMatrixAt(si++, dummy.matrix);
      stripInst.setColorAt(si-1, new THREE.Color(pick(theme.neonColors)));
    });
    stripInst.count = si;
    worldGroup.add(stripInst);
  }

  if(instances.cactus.length){
    const trunkMat = new THREE.MeshStandardMaterial({color:0x3a7a3a, roughness:0.8});
    const trunkInst = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.3,0.4,1,6), trunkMat, instances.cactus.length);
    const dummy = new THREE.Object3D();
    instances.cactus.forEach((c,i)=>{
      dummy.position.set(c.pos.x, c.h/2, c.pos.z);
      dummy.scale.set(1, c.h, 1);
      dummy.updateMatrix();
      trunkInst.setMatrixAt(i, dummy.matrix);
    });
    trunkInst.castShadow = true;
    worldGroup.add(trunkInst);
    sceneryMeshes.push(trunkInst);
  }

  if(instances.rock.length){
    const rockMat = new THREE.MeshStandardMaterial({color:0x8a5a3a, roughness:1, flatShading:true});
    const rockInst = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1,0), rockMat, instances.rock.length);
    const dummy = new THREE.Object3D();
    instances.rock.forEach((r,i)=>{
      dummy.position.set(r.pos.x, r.r*0.5, r.pos.z);
      dummy.scale.setScalar(r.r);
      dummy.rotation.set(rand(0,3),rand(0,3),rand(0,3));
      dummy.updateMatrix();
      rockInst.setMatrixAt(i, dummy.matrix);
    });
    rockInst.castShadow = true;
    worldGroup.add(rockInst);
    sceneryMeshes.push(rockInst);
  }

  if(instances.cloud.length){
    const cloudMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:1, transparent:true, opacity:0.85});
    const cloudInst = new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6), cloudMat, instances.cloud.length*4);
    const dummy = new THREE.Object3D();
    let ci=0;
    instances.cloud.forEach((c)=>{
      for(let k=0;k<4;k++){
        const s=rand(2,5);
        dummy.position.set(c.pos.x+rand(-4,4), rand(15,30)+rand(-1,1), c.pos.z+rand(-4,4));
        dummy.scale.setScalar(s);
        dummy.updateMatrix();
        cloudInst.setMatrixAt(ci++, dummy.matrix);
      }
    });
    cloudInst.count = ci;
    worldGroup.add(cloudInst);
    sceneryMeshes.push(cloudInst);
  }

  if(instances.tree.length){
    const trunkMat = new THREE.MeshStandardMaterial({color:0x6a4a2a, roughness:0.9});
    const leafMat = new THREE.MeshStandardMaterial({color:0x4a9a4a, roughness:0.8, flatShading:true});
    const trunkInst = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.2,0.3,3,6), trunkMat, instances.tree.length);
    const leafInst = new THREE.InstancedMesh(new THREE.SphereGeometry(2,8,6), leafMat, instances.tree.length);
    const dummy = new THREE.Object3D();
    instances.tree.forEach((t,i)=>{
      dummy.position.set(t.pos.x, 1.5, t.pos.z); dummy.scale.set(1,1,1); dummy.updateMatrix();
      trunkInst.setMatrixAt(i, dummy.matrix);
      dummy.position.set(t.pos.x, 4, t.pos.z); dummy.updateMatrix();
      leafInst.setMatrixAt(i, dummy.matrix);
    });
    trunkInst.castShadow = true; leafInst.castShadow = true;
    worldGroup.add(trunkInst); worldGroup.add(leafInst);
    sceneryMeshes.push(trunkInst, leafInst);
  }

  // theme big features
  if(themeKey==='neon') addCitySkyline();
  else if(themeKey==='desert') addMesas();
  else addFloatingIslands();
}

function addCitySkyline(){
  const mat = new THREE.MeshStandardMaterial({color:0x2a2a4a, roughness:0.5, metalness:0.4, emissive:0x111122, emissiveIntensity:0.3});
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), mat, 40);
  const dummy = new THREE.Object3D();
  for(let i=0;i<40;i++){
    const angle=(i/40)*Math.PI*2, r=rand(180,280);
    const h=rand(40,100), w=rand(12,25);
    dummy.position.set(Math.cos(angle)*r, h/2, Math.sin(angle)*r);
    dummy.scale.set(w,h,w); dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }
  worldGroup.add(inst);
  sceneryMeshes.push(inst);
}
function addMesas(){
  const mat = new THREE.MeshStandardMaterial({color:0xb8743a, roughness:1, flatShading:true});
  const capMat = new THREE.MeshStandardMaterial({color:0xd49a5a, roughness:1});
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), mat, 15);
  const capInst = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), capMat, 15);
  const dummy = new THREE.Object3D();
  for(let i=0;i<15;i++){
    const angle=(i/15)*Math.PI*2, r=rand(150,250);
    const h=rand(20,50), w=rand(30,60);
    dummy.position.set(Math.cos(angle)*r, h/2, Math.sin(angle)*r);
    dummy.scale.set(w,h,w); dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
    dummy.position.set(Math.cos(angle)*r, h+1, Math.sin(angle)*r);
    dummy.scale.set(w*1.1,2,w*1.1); dummy.updateMatrix();
    capInst.setMatrixAt(i, dummy.matrix);
  }
  worldGroup.add(inst); worldGroup.add(capInst);
  sceneryMeshes.push(inst, capInst);
}
function addFloatingIslands(){
  for(let i=0;i<12;i++){
    const angle=(i/12)*Math.PI*2, r=rand(120,200);
    const g=new THREE.Group();
    const size=rand(15,30);
    const top=new THREE.Mesh(new THREE.CylinderGeometry(size,size*0.8,4,10), new THREE.MeshStandardMaterial({color:0x66bb44, roughness:1}));
    g.add(top);
    const bot=new THREE.Mesh(new THREE.ConeGeometry(size*0.8,size*1.5,10), new THREE.MeshStandardMaterial({color:0x8a6a4a, roughness:1, flatShading:true}));
    bot.position.y=-size*0.9; bot.rotation.x=Math.PI; g.add(bot);
    const t=new THREE.Mesh(new THREE.SphereGeometry(4,8,6), new THREE.MeshStandardMaterial({color:0x4a9a4a, flatShading:true}));
    t.position.y=5; g.add(t);
    g.position.set(Math.cos(angle)*r, rand(20,50), Math.sin(angle)*r);
    worldGroup.add(g);
  }
}

function createCarBody(startPos, startHeading){
  const halfExtents = new CANNON.Vec3(1.1, 0.5, 2.3);
  carBody = new CANNON.Body({
    mass: CFG.carMass,
    shape: new CANNON.Box(halfExtents),
    position: new CANNON.Vec3(startPos.x, startPos.y + 0.8, startPos.z),
    linearDamping: CFG.linearDamping,
    angularDamping: CFG.angularDamping,
  });
  carBody.quaternion.setFromEuler(0, startHeading, 0);
  carBody.ccdSpeedThreshold = 5;   // 速度超过 5m/s 启用 CCD
  carBody.ccdRadius = 1.0;          // CCD 扫描半径
  world.addBody(carBody);
  // 碰撞音效
  carBody.addEventListener('collide', (e)=>{
    const impact = e.contact ? e.contact.getImpactVelocityAlongNormal() : 0;
    if(Math.abs(impact) > 3) playCrashSound();
  });
}

// ===================== 障碍物 =====================
const OBSTACLE_TYPES = ['cone','banana','pole','pedestrian','oil'];
function spawnObstacles(){
  obstacles = [];
  const count = Math.floor(trackLength / 30);
  for(let i=0;i<count;i++){
    const t=(i+1)/(count+1);
    const p=trackCurve.getPointAt(t);
    const tan=trackCurve.getTangentAt(t);
    const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    const offset=rand(-CFG.trackWidth*0.7, CFG.trackWidth*0.7);
    const pos=p.clone().add(n.multiplyScalar(offset));
    const type=pick(OBSTACLE_TYPES);
    const mesh=createObstacleMesh(type);
    mesh.position.copy(pos);
    mesh.position.y = pos.y + (type==='cone'?0.88 : type==='banana'?0.22 : type==='pedestrian'?1.1 : 0);
    mesh.scale.setScalar(2.2);
    worldGroup.add(mesh);

    // physics body for solid obstacles
    let body = null;
    if(type==='pole' || type==='cone'){
      const r = type==='pole'?0.3:0.4;
      body = new CANNON.Body({ mass:0, shape:new CANNON.Cylinder(r,r,type==='pole'?6:1.6,8) });
      body.position.set(pos.x, pos.y + (type==='pole'?3:0.8), pos.z);
      world.addBody(body);
    }
    obstacles.push({type, pos:mesh.position, mesh, body, radius:getObstacleRadius(type)*2.2, active:true});
  }
}

function createObstacleMesh(type){
  const theme=currentTheme;
  if(type==='cone'){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.ConeGeometry(0.35,0.8,10), new THREE.MeshStandardMaterial({color:0xff6622, emissive:0xff4400, emissiveIntensity:0.3})));
    const b=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.1,0.7), new THREE.MeshStandardMaterial({color:0x333333}));
    b.position.y=-0.4; g.add(b); return g;
  }
  if(type==='banana'){
    const g=new THREE.Group();
    const b=new THREE.Mesh(new THREE.TorusGeometry(0.4,0.1,8,16,Math.PI), new THREE.MeshStandardMaterial({color:0xffdd33, roughness:0.5}));
    b.rotation.x=Math.PI/2; b.rotation.z=Math.PI/4; g.add(b); return g;
  }
  if(type==='pole'){
    const g=new THREE.Group();
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,6,8), new THREE.MeshStandardMaterial({color:0x666666, roughness:0.6, metalness:0.5}));
    pole.position.y=3; g.add(pole);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(2,0.1,0.1), new THREE.MeshStandardMaterial({color:0x555555}));
    arm.position.set(0.5,5.5,0); g.add(arm);
    const light=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8), new THREE.MeshStandardMaterial({color:theme.accent, emissive:theme.accent, emissiveIntensity:2}));
    light.position.set(1.3,5.5,0); g.add(light); return g;
  }
  if(type==='pedestrian'){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.25,0.8,4,8), new THREE.MeshStandardMaterial({color:pick([0xff4444,0x4488ff,0x44ff88,0xffaa44]), roughness:0.7}));
    body.position.y=1.0; g.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.2,10,10), new THREE.MeshStandardMaterial({color:0xeebb99, roughness:0.6}));
    head.position.y=1.65; g.add(head); return g;
  }
  if(type==='oil'){
    return new THREE.Mesh(new THREE.CircleGeometry(1.2,20), new THREE.MeshStandardMaterial({color:0x111122, roughness:0.2, metalness:0.6, transparent:true, opacity:0.8}));
  }
  return new THREE.Mesh();
}
function getObstacleRadius(type){
  if(type==='oil') return 1.2;
  if(type==='banana') return 0.5;
  if(type==='pedestrian') return 0.6;
  if(type==='pole') return 0.5;
  return 0.6;
}

// ===================== 粒子系统 =====================
function buildParticles(themeKey){
  particleSystems.forEach(p=>{ scene.remove(p.mesh); });
  particleSystems = [];
  const theme = currentTheme;
  const count = IS_MOBILE ? 150 : 300;
  const positions = new Float32Array(count*3);
  const velocities = [];

  if(themeKey==='neon'){
    // floating neon light spots
    const geo = new THREE.BufferGeometry();
    for(let i=0;i<count;i++){
      positions[i*3]=rand(-200,200); positions[i*3+1]=rand(2,40); positions[i*3+2]=rand(-200,200);
      velocities.push(new THREE.Vector3(rand(-0.5,0.5), rand(0.1,0.5), rand(-0.5,0.5)));
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const mat = new THREE.PointsMaterial({color:theme.accent, size:1.5, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, depthWrite:false});
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);
    particleSystems.push({mesh:pts, velocities, type:'float', bounds:200});
  } else if(themeKey==='desert'){
    // sand dust
    const geo = new THREE.BufferGeometry();
    for(let i=0;i<count;i++){
      positions[i*3]=rand(-150,150); positions[i*3+1]=rand(0.5,15); positions[i*3+2]=rand(-150,150);
      velocities.push(new THREE.Vector3(rand(2,8), rand(-0.2,0.2), rand(-1,1)));
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const mat = new THREE.PointsMaterial({color:0xd4a574, size:2, transparent:true, opacity:0.4, depthWrite:false});
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);
    particleSystems.push({mesh:pts, velocities, type:'wind', bounds:150});
  } else {
    // cloud mist + waterfall
    const geo = new THREE.BufferGeometry();
    for(let i=0;i<count;i++){
      positions[i*3]=rand(-150,150); positions[i*3+1]=rand(5,60); positions[i*3+2]=rand(-150,150);
      velocities.push(new THREE.Vector3(rand(-0.3,0.3), rand(-0.5,-0.1), rand(-0.3,0.3)));
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const mat = new THREE.PointsMaterial({color:0xffffff, size:3, transparent:true, opacity:0.3, depthWrite:false});
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);
    particleSystems.push({mesh:pts, velocities, type:'mist', bounds:150});
  }
}

function updateParticles(dt){
  if(!carBody) return;
  const cp = carBody.position;
  particleSystems.forEach(ps=>{
    const pos = ps.mesh.geometry.attributes.position.array;
    for(let i=0;i<ps.velocities.length;i++){
      pos[i*3] += ps.velocities[i].x*dt;
      pos[i*3+1] += ps.velocities[i].y*dt;
      pos[i*3+2] += ps.velocities[i].z*dt;
      // wrap around car
      const dx=pos[i*3]-cp.x, dz=pos[i*3+2]-cp.z;
      if(Math.abs(dx)>ps.bounds) pos[i*3] = cp.x + Math.sign(-dx)*ps.bounds;
      if(Math.abs(dz)>ps.bounds) pos[i*3+2] = cp.z + Math.sign(-dz)*ps.bounds;
      if(ps.type==='mist' && pos[i*3+1]<2) pos[i*3+1]=60;
      if(ps.type==='wind' && Math.abs(pos[i*3]-cp.x)>ps.bounds) pos[i*3]=cp.x - ps.bounds;
    }
    ps.mesh.geometry.attributes.position.needsUpdate = true;
  });
}

// ===================== 音效 =====================
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
}

function startEngineSound(){
  if(!audioCtx) initAudio();
  if(audioCtx.state==='suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  osc.type='sawtooth'; osc.frequency.value=60;
  const gain = audioCtx.createGain(); gain.gain.value=0.08;
  const filt = audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=800;
  osc.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
  osc.start();
  engineSound = {osc, gain, filt};
}
function updateEngineSound(speed){
  if(!engineSound) return;
  const rpm = 60 + speed*8;
  engineSound.osc.frequency.setTargetAtTime(rpm, audioCtx.currentTime, 0.05);
  engineSound.filt.frequency.setTargetAtTime(600+speed*30, audioCtx.currentTime, 0.05);
}
function playCrashSound(){
  if(!audioCtx) return;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.3, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const g=audioCtx.createGain(); g.gain.value=0.3;
  const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start();
}

// ===================== BGM =====================
const CHORDS=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]];
const BASS_NOTES=[110,87.31,130.81,98];
function startMusic(){
  if(!audioCtx) initAudio();
  if(audioCtx.state==='suspended') audioCtx.resume();
  stopMusic(); if(!musicOn) return;
  const beat=0.6, bar=beat*4, t0=audioCtx.currentTime+0.05;
  const master=audioCtx.createGain(); master.gain.value=0.3; master.connect(audioCtx.destination);
  const comp=audioCtx.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=4; comp.connect(master);

  const padGain=audioCtx.createGain(); padGain.gain.value=0.15; padGain.connect(comp);
  function playPad(st,chord,dur){
    chord.forEach(f=>{
      const o1=audioCtx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=f;
      const o2=audioCtx.createOscillator(); o2.type='sawtooth'; o2.frequency.value=f*1.005;
      const g=audioCtx.createGain();
      g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(0.1,st+0.3);
      g.gain.setValueAtTime(0.1,st+dur-0.3); g.gain.linearRampToValueAtTime(0.001,st+dur);
      const fl=audioCtx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=1200;
      o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(padGain);
      o1.start(st); o1.stop(st+dur+0.05); o2.start(st); o2.stop(st+dur+0.05);
    });
  }
  const bassGain=audioCtx.createGain(); bassGain.gain.value=0.4; bassGain.connect(comp);
  function playBass(st,freq){
    for(let b=0;b<4;b++){
      const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.value=freq;
      const g=audioCtx.createGain(); const bt=st+b*beat;
      g.gain.setValueAtTime(0,bt); g.gain.linearRampToValueAtTime(0.3,bt+0.01); g.gain.exponentialRampToValueAtTime(0.001,bt+beat*0.9);
      const fl=audioCtx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=350;
      o.connect(fl); fl.connect(g); g.connect(bassGain); o.start(bt); o.stop(bt+beat);
    }
  }
  const leadNotes=[440,523.25,659.25,523.25,440,392,440,523.25,587.33,659.25,783.99,659.25,587.33,523.25,440,392];
  const leadGain=audioCtx.createGain(); leadGain.gain.value=0.1; leadGain.connect(comp);
  function playLead(st){
    for(let i=0;i<16;i++){
      const o=audioCtx.createOscillator(); o.type='triangle'; o.frequency.value=leadNotes[i];
      const g=audioCtx.createGain(); const nt=st+i*beat*0.5;
      g.gain.setValueAtTime(0,nt); g.gain.linearRampToValueAtTime(0.2,nt+0.02); g.gain.exponentialRampToValueAtTime(0.001,nt+beat*0.45);
      const fl=audioCtx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=3000;
      o.connect(fl); fl.connect(g); g.connect(leadGain); o.start(nt); o.stop(nt+beat*0.5);
    }
  }
  const drumGain=audioCtx.createGain(); drumGain.gain.value=0.4; drumGain.connect(comp);
  function kick(t){const o=audioCtx.createOscillator(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12); const g=audioCtx.createGain(); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18); o.connect(g); g.connect(drumGain); o.start(t); o.stop(t+0.2)}
  function snare(t){const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.18,audioCtx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2); const s=audioCtx.createBufferSource(); s.buffer=buf; const f=audioCtx.createBiquadFilter(); f.type='highpass'; f.frequency.value=1500; const g=audioCtx.createGain(); g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12); s.connect(f); f.connect(g); g.connect(drumGain); s.start(t); s.stop(t+0.14)}
  function hihat(t){const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.05,audioCtx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; const s=audioCtx.createBufferSource(); s.buffer=buf; const f=audioCtx.createBiquadFilter(); f.type='highpass'; f.frequency.value=8000; const g=audioCtx.createGain(); g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.03); s.connect(f); f.connect(g); g.connect(drumGain); s.start(t); s.stop(t+0.04)}
  function playDrums(st){for(let b=0;b<4;b++){kick(st+b*beat); if(b===1||b===3)snare(st+b*beat); hihat(st+b*beat); hihat(st+b*beat+beat*0.5)}}

  function scheduleBars(st){
    for(let bi=0;bi<4;bi++){const bt=st+bi*bar; playPad(bt,CHORDS[bi],bar); playBass(bt,BASS_NOTES[bi]); playLead(bt); playDrums(bt)}
  }
  const loopDur=bar*4; scheduleBars(t0);
  const loopTimer=setInterval(()=>{if(!musicNodes){clearInterval(loopTimer);return} scheduleBars(audioCtx.currentTime+0.05)}, loopDur*1000);
  musicNodes={master, loopTimer};
}
function stopMusic(){
  if(musicNodes){clearInterval(musicNodes.loopTimer); try{musicNodes.master.disconnect()}catch(e){} musicNodes=null}
}

let selectedMap = null;

function startRace(themeKey){
  // 清理上一局残留（retry 场景）
  if(engineSound){try{engineSound.osc.stop()}catch(e){} engineSound=null}
  if(carBody){world.removeBody(carBody); carBody=null}
  if(carMesh){scene.remove(carMesh); carMesh=null}
  aiCars.forEach(a=>{ if(worldGroup) worldGroup.remove(a.mesh) }); aiCars=[];
  obstacles.forEach(o=>{ if(o.body) world.removeBody(o.body) }); obstacles=[];
  wallBodies.forEach(b=>world.removeBody(b)); wallBodies=[];
  if(worldGroup){scene.remove(worldGroup); worldGroup=null}
  sceneryMeshes=[];
  particleSystems.forEach(p=>scene.remove(p.mesh)); particleSystems=[];

  const theme = MAP_THEMES[themeKey];
  currentThemeKey = themeKey;
  applyTheme(theme);
  generateTrack(themeKey);
  buildTrack();
  buildScenery();
  buildParticles(themeKey);
  mmCached = null; // 重置小地图缓存

  // car
  carMesh = buildCarMesh();
  const startPos = trackCurve.getPointAt(0);
  const startTan = trackCurve.getTangentAt(0);
  const startHeading = Math.atan2(startTan.x, startTan.z);
  carMesh.position.set(startPos.x, startPos.y + 0.8, startPos.z);
  carMesh.rotation.y = startHeading;
  scene.add(carMesh);

  createCarBody(startPos, startHeading);

  spawnObstacles();
  spawnAI();
  startEngineSound();

  distance=0; raceTime=0; maxSpeedReached=0; trackProgress=0;
  gameState='countdown';
  document.getElementById('hud').classList.add('active');
  document.getElementById('menu').classList.remove('active');
  document.getElementById('result').classList.remove('active');

  let n=3;
  const cdEl=document.getElementById('cd-num');
  const cdDiv=document.getElementById('countdown');
  cdDiv.classList.add('active'); cdEl.textContent=n; cdEl.style.color='#fff';
  const cdInt=setInterval(()=>{
    n--;
    if(n>0){cdEl.textContent=n; cdEl.style.animation='none'; void cdEl.offsetWidth; cdEl.style.animation='pop .8s ease-out'}
    else if(n===0){cdEl.textContent='GO!'; cdEl.style.color='#'+theme.accent.toString(16).padStart(6,'0')}
    else{clearInterval(cdInt); cdDiv.classList.remove('active'); gameState='racing'; startMusic()}
  }, 900);
  if('ontouchstart' in window) document.getElementById('touch').classList.add('active');
}

// ===================== 物理更新 =====================
const _fwdVec = new THREE.Vector3();
const _qTmp = new THREE.Quaternion();
function getCarForward(){
  // 从四元数准确计算前向向量
  const q = carBody.quaternion;
  _qTmp.set(q.x, q.y, q.z, q.w);
  _fwdVec.set(0,0,1).applyQuaternion(_qTmp);
  return _fwdVec;
}

function updateCarPhysics(dt){
  if(!carBody) return;
  const fwd = getCarForward();
  const fwdX = fwd.x, fwdZ = fwd.z;
  const speed = carBody.velocity.length();
  // 前向速度（用于仪表和加速力方向）
  const fwdSpeed = carBody.velocity.x*fwdX + carBody.velocity.z*fwdZ;

  // 引擎力（沿车头方向）
  if(input.gas && fwdSpeed < CFG.maxSpeed){
    carBody.applyForce(new CANNON.Vec3(fwdX*CFG.engineForce, 0, fwdZ*CFG.engineForce), carBody.position);
  }
  // 刹车
  if(input.brake){
    const brakeDecel = CFG.brakeForce / CFG.carMass;
    const f = Math.max(0, fwdSpeed - brakeDecel*dt*3.5);
    carBody.velocity.x = fwdX*f + (carBody.velocity.x - fwdX*fwdSpeed)*0.92;
    carBody.velocity.z = fwdZ*f + (carBody.velocity.z - fwdZ*fwdSpeed)*0.92;
  }

  // 下压力：速度越快贴地越紧，防飞天
  if(speed > 1){
    const down = speed * speed * CFG.downForce * 0.5;
    carBody.applyForce(new CANNON.Vec3(0, -down, 0), carBody.position);
  }

  // 转向：速度越快转向越灵敏但有上限，加入平滑
  const steerInput = (input.left?1:0) - (input.right?1:0);
  const steerFactor = Math.min(1, speed/15); // 低速不打死方向
  const targetAngVel = steerInput * CFG.maxSteer * CFG.steerSpeed * steerFactor * (fwdSpeed>=0?1:-0.6);
  carBody.angularVelocity.y = THREE.MathUtils.lerp(carBody.angularVelocity.y, targetAngVel, 0.12);

  // 防翻滚：强制车身保持 upright
  const euler = new CANNON.Vec3();
  carBody.quaternion.toEuler(euler);
  if(Math.abs(euler.x) > 0.15){ carBody.angularVelocity.x *= 0.6; euler.x *= 0.9; }
  if(Math.abs(euler.z) > 0.15){ carBody.angularVelocity.z *= 0.6; euler.z *= 0.9; }
  // 轻微修正俯仰/侧倾，避免永久倾斜
  carBody.quaternion.setFromEuler(euler.x*0.95, euler.y, euler.z*0.95);

  // 地面跟随：钳制到赛道高度，防钻地
  const trackY = getTrackHeightAt(carBody.position.x, carBody.position.z);
  const groundY = trackY + 0.55; // 车身半高
  if(carBody.position.y < groundY){
    carBody.position.y = groundY;
    if(carBody.velocity.y < 0) carBody.velocity.y = 0;
  }
  // 飞天保护：超过赛道高度+15m 强制拉回
  if(carBody.position.y > trackY + 18){
    carBody.position.y = trackY + 2;
    carBody.velocity.y = -2;
  }

  // 速度上限钳制
  if(speed > CFG.maxSpeed){
    const s = CFG.maxSpeed / speed;
    carBody.velocity.scale(s, carBody.velocity);
  }

  if(fwdSpeed > maxSpeedReached) maxSpeedReached = fwdSpeed;

  // 同步 mesh
  carMesh.position.set(carBody.position.x, carBody.position.y, carBody.position.z);
  carMesh.quaternion.set(carBody.quaternion.x, carBody.quaternion.y, carBody.quaternion.z, carBody.quaternion.w);
  // 过弯侧倾
  const tilt = -carBody.angularVelocity.y * 0.25;
  carMesh.rotation.z = THREE.MathUtils.lerp(carMesh.rotation.z, tilt, 0.1);

  updateEngineSound(Math.abs(fwdSpeed));

  trackProgress = findNearestT(carBody.position);
  distance = Math.floor(trackProgress * trackLength);

  // 障碍物碰撞
  for(const obs of obstacles){
    if(!obs.active) continue;
    const dx=carBody.position.x-obs.pos.x, dz=carBody.position.z-obs.pos.z;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d < obs.radius + 1.5){
      if(obs.type==='banana'){
        carBody.angularVelocity.y += rand(-4,4);
        carBody.velocity.scale(0.5, carBody.velocity);
        obs.active=false; obs.mesh.visible=false;
        playCrashSound();
      } else if(obs.type==='oil'){
        carBody.velocity.scale(0.85, carBody.velocity);
        carBody.angularVelocity.y += (Math.random()-0.5)*3;
      } else if(obs.type==='pedestrian'){
        carBody.velocity.scale(0.3, carBody.velocity);
        obs.active=false; obs.mesh.visible=false;
        raceTime += 3;
        playCrashSound();
      }
    }
  }

  if(trackProgress >= 0.99) finishRace();
}

function findNearestT(pos){
  if(!trackHeightSamples.length) return trackProgress;
  let bestT = trackProgress, bestDist = Infinity;
  const startT = trackProgress;
  const range = 0.06;
  const start = Math.max(0, Math.floor((startT-range)*trackHeightSamples.length));
  const end = Math.min(trackHeightSamples.length, Math.ceil((startT+range)*trackHeightSamples.length));
  for(let i=start;i<end;i++){
    const s = trackHeightSamples[i];
    const dx = s.x-pos.x, dz = s.z-pos.z;
    const d = dx*dx+dz*dz;
    if(d<bestDist){bestDist=d; bestT=s.t}
  }
  return bestT;
}

function updateAI(dt){
  for(const ai of aiCars){
    ai.t += ai.speed*dt;
    if(ai.t>=1) ai.t = 0;
    const p=trackCurve.getPointAt(ai.t);
    const tan=trackCurve.getTangentAt(ai.t);
    const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    ai.mesh.position.set(p.x+n.x*ai.offset, p.y+0.3, p.z+n.z*ai.offset);
    ai.mesh.rotation.y = Math.atan2(tan.x, tan.z);
  }
}

// ===================== 相机 =====================
let camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
const _camTarget = new THREE.Vector3(), _camLookTarget = new THREE.Vector3();
function updateCamera(dt){
  if(!carBody || !carMesh) return;
  const fwd = getCarForward();
  const cp = carBody.position;
  // 相机高度跟随赛道高度，不随车身俯仰乱飞
  const trackY = getTrackHeightAt(cp.x, cp.z);

  if(cameraMode===3){
    carMesh.visible = true;
    _camTarget.set(cp.x, cp.y, cp.z).addScaledVector(fwd, -11);
    _camTarget.y = Math.max(trackY + 5, cp.y + 4.5);
    camPos.lerp(_camTarget, 0.1);
    _camLookTarget.set(cp.x, cp.y+1.2, cp.z).addScaledVector(fwd, 10);
    camLook.lerp(_camLookTarget, 0.12);
  } else {
    carMesh.visible = false;
    _camTarget.set(cp.x, cp.y+2, cp.z).addScaledVector(fwd, 0.5);
    camPos.lerp(_camTarget, 0.3);
    _camLookTarget.set(cp.x, cp.y+1.8, cp.z).addScaledVector(fwd, 18);
    camLook.lerp(_camLookTarget, 0.18);
  }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}

// 构建小地图静态缓存（赛道线+终点）
function buildMinimapCache(){
  const canvas = document.getElementById('mm'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='rgba(0,10,20,0.8)'; ctx.fillRect(0,0,w,h);
  const pts=trackCurve.getSpacedPoints(120);
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z)});
  const scale=Math.min(w/(maxX-minX),h/(maxZ-minZ))*0.85;
  const ox=(w-(maxX-minX)*scale)/2-minX*scale, oz=(h-(maxZ-minZ)*scale)/2-minZ*scale;
  ctx.strokeStyle='#'+currentTheme.accent.toString(16).padStart(6,'0'); ctx.lineWidth=4; ctx.beginPath();
  pts.forEach((p,i)=>{const x=p.x*scale+ox,y=p.z*scale+oz; if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}); ctx.stroke();
  const fp=trackCurve.getPointAt(0.99); ctx.fillStyle='#ffff00'; ctx.fillRect(fp.x*scale+ox-3,fp.z*scale+oz-3,6,6);
  // 保存静态图层为 ImageData
  mmCached = ctx.getImageData(0,0,w,h);
  mmCached.scale = scale; mmCached.ox = ox; mmCached.oz = oz;
}

function drawMinimap(){
  const canvas = document.getElementById('mm'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;
  if(!mmCached){ buildMinimapCache(); if(!mmCached) return; }
  // 恢复静态图层
  ctx.putImageData(mmCached, 0, 0);
  // 动态：障碍物
  ctx.fillStyle='#ff4444';
  obstacles.forEach(o=>{if(!o.active)return; ctx.beginPath(); ctx.arc(o.pos.x*mmCached.scale+mmCached.ox,o.pos.z*mmCached.scale+mmCached.oz,2,0,Math.PI*2); ctx.fill()});
  // 动态：玩家
  if(carBody){ctx.fillStyle='#00ff88'; ctx.beginPath(); ctx.arc(carBody.position.x*mmCached.scale+mmCached.ox,carBody.position.z*mmCached.scale+mmCached.oz,4,0,Math.PI*2); ctx.fill()}
}

function finishRace(){
  gameState='finished'; stopMusic();
  if(engineSound){try{engineSound.osc.stop()}catch(e){} engineSound=null}
  const name=currentTheme.name;
  if(!bestTimes[name] || raceTime < parseFloat(bestTimes[name])) bestTimes[name]=raceTime.toFixed(1);
  document.getElementById('r-dist').textContent=distance+' m';
  document.getElementById('r-time').textContent=raceTime.toFixed(1)+' s';
  document.getElementById('r-speed').textContent=Math.floor(maxSpeedReached*3.6)+' km/h';
  document.getElementById('result').classList.add('active');
}

// ===================== 主循环 =====================
const FIXED_DT = 1/60;
let physicsAcc = 0;
function animate(){
  requestAnimationFrame(animate);
  if(!renderer) return;
  const dt = Math.min(clock.getDelta(), 0.05);

  if(gameState==='racing' && world){
    raceTime += dt;
    physicsAcc += dt;
    while(physicsAcc >= FIXED_DT){
      world.step(FIXED_DT);
      physicsAcc -= FIXED_DT;
    }
    updateCarPhysics(dt);
    updateAI(dt);
    updateHUD();
  }
  updateParticles(dt);
  if(carBody) updateCamera(dt);
  renderer.render(scene, camera);
}

function setupInput(){
  addEventListener('keydown', e=>{
    if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft') input.left=true;
    if(e.key==='d'||e.key==='D'||e.key==='ArrowRight') input.right=true;
    if(e.key==='w'||e.key==='W'||e.key==='ArrowUp') input.gas=true;
    if(e.key==='s'||e.key==='S'||e.key==='ArrowDown') input.brake=true;
    if(e.key==='c'||e.key==='C') toggleCamera();
    if(e.key==='Escape'){ if(gameState==='racing') pauseGame(); else if(gameState==='paused') resumeGame(); }
  });
  addEventListener('keyup', e=>{
    if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft') input.left=false;
    if(e.key==='d'||e.key==='D'||e.key==='ArrowRight') input.right=false;
    if(e.key==='w'||e.key==='W'||e.key==='ArrowUp') input.gas=true;
    if(e.key==='s'||e.key==='S'||e.key==='ArrowDown') input.brake=false;
  });
  document.querySelectorAll('.t-btn').forEach(btn=>{
    const k=btn.dataset.k;
    const on=e=>{e.preventDefault(); input[k]=true};
    const off=e=>{e.preventDefault(); input[k]=false};
    btn.addEventListener('touchstart', on, {passive:false});
    btn.addEventListener('touchend', off, {passive:false});
    btn.addEventListener('touchcancel', off, {passive:false});
  });
}

function toggleCamera(){
  cameraMode = cameraMode===3 ? 1 : 3;
  document.getElementById('cam-btn').textContent = cameraMode===1 ? '视角: 车内 [C]' : '视角: 追尾 [C]';
}
function pauseGame(){
  if(gameState!=='racing') return;
  gameState='paused';
  document.getElementById('pause').classList.add('active');
  if(musicOn && audioCtx) audioCtx.suspend();
}
function resumeGame(){
  if(gameState!=='paused') return;
  gameState='racing';
  document.getElementById('pause').classList.remove('active');
  if(musicOn && audioCtx) audioCtx.resume();
}
function backToMenu(){
  gameState='menu'; stopMusic();
  if(engineSound){try{engineSound.osc.stop()}catch(e){} engineSound=null}
  if(carBody){world.removeBody(carBody); carBody=null}
  if(carMesh){scene.remove(carMesh); carMesh=null}
  aiCars.forEach(a=>{ if(worldGroup) worldGroup.remove(a.mesh) }); aiCars=[];
  obstacles.forEach(o=>{ if(o.body) world.removeBody(o.body) }); obstacles=[];
  wallBodies.forEach(b=>world.removeBody(b)); wallBodies=[];
  if(worldGroup){scene.remove(worldGroup); worldGroup=null}
  sceneryMeshes=[];
  particleSystems.forEach(p=>scene.remove(p.mesh)); particleSystems=[];
  mmCached = null;
  document.getElementById('pause').classList.remove('active');
  document.getElementById('result').classList.remove('active');
  document.getElementById('hud').classList.remove('active');
  document.getElementById('countdown').classList.remove('active');
  document.getElementById('menu').classList.add('active');
}

// ===================== 菜单 =====================
function buildMenu(){
  const grid=document.getElementById('map-grid'); grid.innerHTML='';
  Object.entries(MAP_THEMES).forEach(([key,theme])=>{
    const wrap=document.createElement('div'); wrap.className='map-card-wrap';
    wrap.innerHTML=`<div class="map-thumb" style="background:linear-gradient(135deg,#${theme.sky.toString(16).padStart(6,'0')},#${theme.accent.toString(16).padStart(6,'0')})">${theme.icon}</div><div class="map-info"><h3>${theme.name}</h3><p>${theme.desc}</p></div>`;
    wrap.onclick=()=>{
      document.querySelectorAll('.map-card-wrap').forEach(c=>c.classList.remove('selected'));
      wrap.classList.add('selected'); selectedMap=key;
      document.getElementById('start-btn').disabled=false;
    };
    grid.appendChild(wrap);
  });
  document.getElementById('start-btn').onclick=()=>{ if(selectedMap) startRace(selectedMap) };
  document.getElementById('retry-btn').onclick=()=>{ if(selectedMap) startRace(selectedMap) };
  document.getElementById('menu-btn').onclick=backToMenu;
  document.getElementById('cam-btn').onclick=toggleCamera;
  document.getElementById('music-btn').onclick=toggleMusic;
  document.getElementById('pause-btn').onclick=pauseGame;
  document.getElementById('resume-btn').onclick=resumeGame;
  document.getElementById('back-menu-btn').onclick=backToMenu;
}

function toggleMusic(){
  musicOn=!musicOn;
  document.getElementById('music-btn').textContent=musicOn?'♪ 音乐 开':'♪ 音乐 关';
  if(gameState==='racing'){ if(musicOn) startMusic(); else stopMusic() }
}

// ===================== 启动 =====================
try {
  initScene();
} catch(e){
  console.warn('WebGL 初始化失败，游戏无法运行：', e.message);
}
try { initPhysics(); } catch(e){ console.warn('物理初始化失败', e); }
setupInput();
buildMenu();
animate();
</script>
