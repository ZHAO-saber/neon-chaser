<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <meta name="theme-color" content="#050510" />
    <meta name="description" content="霓虹追逐 · Neon Chaser - Phaser 3 跑酷游戏" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="霓虹追逐" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./assets/sprites/player.png" />
    <link rel="apple-touch-icon" href="./assets/sprites/player.png" />
    <meta property="og:title" content="霓虹追逐 · Neon Chaser" />
    <meta property="og:description" content="Phaser 3 跑酷游戏 — 跳跃、滑铲、收集金币" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/sprites/player.png" />
    <meta name="twitter:card" content="summary" />
    <title>霓虹追逐 · Neon Chaser</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #050510;
        overflow: hidden;
        /* 触摸优化：禁止默认手势 */
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        /* 安全区适配 */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        width: 100vw;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #game { width: 100%; height: 100%; }
      /* 横屏引导遮罩（竖屏时显示） */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        background: #050510;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #ff3355;
        font-size: 20px;
        text-align: center;
      }
      #rotate-hint .icon {
        font-size: 64px;
        animation: rotate 2s ease-in-out infinite;
        margin-bottom: 20px;
      }
      @keyframes rotate {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(90deg); }
      }
      /* 竖屏时显示遮罩 */
      @media (orientation: portrait) {
        #rotate-hint { display: flex; }
        #game { display: none; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-3dPmBaT3.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-Pd2ESoD5.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">
      <div class="icon">📱</div>
      <div>请横屏游玩</div>
      <div style="font-size:14px;color:#888;margin-top:10px">Rotate your device</div>
    </div>
  </body>
</html>
