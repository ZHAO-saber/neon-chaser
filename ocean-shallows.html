let surfGain;document.querySelector('#sound').onclick=()=>{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();master=audioCtx.createGain();master.gain.value=0;master.connect(audioCtx.destination);const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate),data=buffer.getChannelData(0);let last=0;for(let i=0;i<data.length;i++){last=(last+.025*(Math.random()*2-1))/1.025;data[i]=last*5}const src=audioCtx.createBufferSource();src.buffer=buffer;src.loop=true;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1100;surfGain=audioCtx.createGain();src.connect(filter);filter.connect(surfGain);surfGain.connect(master);src.start()}audioCtx.resume();sound=!sound;master.gain.setTargetAtTime(sound?.55:0,audioCtx.currentTime,.3);document.querySelector('#sound').textContent=sound?'Sound on':'Sound off';setToggle('sound',sound)};
function tone(freq,duration,gain){if(!sound||!audioCtx)return;const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(freq*.4,audioCtx.currentTime+duration);g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.connect(g);g.connect(master);osc.start();osc.stop(audioCtx.currentTime+duration)}
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey)return;const id={r:'rain',w:'whirl',c:'calm',m:'sound',h:'hide'}[e.key.toLowerCase()];if(id)document.getElementById(id).click()});
function resize(){aspect=innerWidth/innerHeight;extent.set(aspect*14,14);camera.left=-extent.x/2;camera.right=extent.x/2;camera.top=7;camera.bottom=-7;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);waterUniforms.ratio.value=aspect}addEventListener('resize',resize);resize();
for(let i=0;i<8;i++){const p=uvWorld(.38+Math.random()*.5,.2+Math.random()*.52);add(i%5,p.x,p.y,false)}
let last=performance.now(),avg=16,frames=0,quality=Math.min(devicePixelRatio,1.75);function frame(now){requestAnimationFrame(frame);const elapsed=now-last,dt=Math.min(.04,elapsed/1000);last=now;time+=dt;avg=avg*.98+elapsed*.02;if(++frames%240===0&&avg>27&&quality>.8){quality=Math.max(.8,quality*.82);renderer.setPixelRatio(quality);renderer.setSize(innerWidth,innerHeight)}waterUniforms.t.value=time;waterUniforms.vortex.value+=(Number(vortex)-waterUniforms.vortex.value)*dt*2;
if(rain&&Math.random()<dt*24){const p=uvWorld(Math.random(),Math.random());if(seaAt(p.x,p.y)){ripple(p.x,p.y,.3);if(Math.random()<.1)tone(700+Math.random()*800,.09,.015)}}simClock+=dt;let iterations=0;while(simClock>=1/60&&iterations<3){simMat.uniforms.previous.value=targets[simIndex].texture;renderer.setRenderTarget(targets[1-simIndex]);renderer.render(simScene,simCam);simIndex=1-simIndex;simMat.uniforms.impulse.value.z=0;simClock-=1/60;iterations++}waterUniforms.wave.value=targets[simIndex].texture;renderer.setRenderTarget(null);
for(const a of animals){if(a===held){a.shadow.position.set(a.mesh.position.x+.15,a.mesh.position.y-.17,.05);continue}a.age+=dt;a.flee=Math.max(0,a.flee-dt);let p=a.mesh.position;if(a.air>0){a.air=Math.max(0,a.air-dt*1.15);p.z=.55+Math.sin(a.air*Math.PI)*2.7;if(a.air===0)splash(p.x,p.y)}else{let turn=Math.sin(time*.35+a.phase)*.3;const nx=p.x-Math.sin(a.angle)*.7,ny=p.y+Math.cos(a.angle)*.7;if(!seaAt(nx,ny)||Math.abs(nx)>extent.x*.47||Math.abs(ny)>6.5)turn+=2.8;a.angle+=turn*dt;let speed=a.speed*(a.flee>0?3:1);if(a.type===2){if(a.rest>0){a.rest-=dt;speed=0}else if(Math.random()<dt*.035)a.rest=4+Math.random()*6}if(a.type>=3)speed*=.55+.65*Math.pow(Math.max(0,Math.sin(time*2.3+a.phase)),4);p.x-=Math.sin(a.angle)*speed*dt;p.y+=Math.cos(a.angle)*speed*dt;if(vortex){const wp=uvWorld(whirlPos.x,whirlPos.y),d=new THREE.Vector2(wp.x-p.x,wp.y-p.y),len=d.length();p.x+=(d.x*.35-d.y*.75)*dt/(1+len);p.y+=(d.y*.35+d.x*.75)*dt/(1+len)}p.x=THREE.MathUtils.clamp(p.x,-extent.x*.49,extent.x*.49);p.y=THREE.MathUtils.clamp(p.y,-6.8,6.8);p.z=.55;if(a.type<2&&a.age>8&&Math.random()<dt*.006){a.air=1;a.age=0}if(a.type<3&&Math.random()<dt*1.5)ripple(p.x,p.y,.08)}a.mesh.rotation.z=a.angle;a.mesh.rotation.y=a.air>0&&a.type<2?(1-a.air)*Math.PI*2:Math.sin(time+a.phase)*.12;
const parts=a.mesh.userData.parts;if(a.type<3){const arr=parts.body.geometry.attributes.position.array,b=parts.base;for(let i=0;i<arr.length;i+=3){const x=b[i];arr[i+2]=b[i+2]+Math.sin(time*(a.type===2?3.5:2.6)+a.phase-Math.abs(x)*1.8+b[i+1]*(a.type===2?4:0))*Math.pow(Math.abs(x),1.5)*.27}parts.body.geometry.attributes.position.needsUpdate=true}else{const pulse=1-.13*Math.pow(Math.max(0,Math.sin(time*2.3+a.phase)),4);parts.bell.scale.set(pulse,1,pulse);parts.rim.scale.setScalar(pulse);for(const tent of parts.tentacles){const arr=tent.mesh.geometry.attributes.position.array;for(let i=0;i<arr.length;i+=3){const weight=(.85-tent.base[i+1])/(a.type===4?1.7:.65);arr[i]=tent.base[i]+Math.sin(time*1.7+weight*3+tent.a)*.11*weight;arr[i+2]=Math.sin(time+weight*4+tent.a)*.04*weight}tent.mesh.geometry.attributes.position.needsUpdate=true}}a.shadow.position.set(p.x+.13,p.y-.17,.05);a.shadow.material.opacity=a.air>0?.08:.18}
for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.age+=dt;if(r.age<0)continue;const k=r.age/(r.silt?2.5:1.5);r.mesh.scale.setScalar((.08+r.age*1.1)*r.big);r.mesh.material.opacity=Math.max(0,(1-k)*(r.silt?.25:.42));if(k>=1){scene.remove(r.mesh);r.mesh.geometry.dispose();r.mesh.material.dispose();rings.splice(i,1)}}for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.age+=dt;d.v.z-=dt*6;d.mesh.position.addScaledVector(d.v,dt);if(d.mesh.position.z<.4||d.age>1.3){scene.remove(d.mesh);d.mesh.geometry.dispose();d.mesh.material.dispose();drops.splice(i,1)}}if(sound&&surfGain)surfGain.gain.value=.15+.16*(.5+.5*Math.sin(time*1.15));renderer.render(scene,camera)}requestAnimationFrame(frame);
