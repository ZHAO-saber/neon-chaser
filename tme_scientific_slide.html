<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spatial Multi-omics — Tumor Immune Evasion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ivory:#F5F1E8;
    --ivory-2:#ECE6D7;
    --navy:#0E2240;
    --navy-soft:#1B3358;
    --teal:#2A7E7F;
    --teal-soft:#5FA3A0;
    --teal-pale:#B8D8D6;
    --coral:#C95D4F;
    --coral-soft:#E2907F;
    --coral-pale:#F2CDBF;
    --amber:#C9A24B;
    --ink-2:#3B4A63;
    --neutral-1:#6B6358;
    --neutral-2:#A39A8B;
    --neutral-3:#D8D1C2;
    --line:#C9C0AE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0a0f1c;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;color:var(--navy)}
  .stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
  .slide{width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:var(--ivory);box-shadow:0 30px 80px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.04) inset;position:relative;overflow:hidden}
  .slide svg{width:100%;height:100%;display:block}
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spatial multi-omics reveals mechanisms of immune evasion in the tumor microenvironment">
<defs>
  <!-- ===== Typography ===== -->
  <style>
    .t-title{font-family:'Sora',sans-serif;font-weight:700;fill:#0E2240}
    .t-sub{font-family:'IBM Plex Sans',sans-serif;font-weight:400;fill:#3B4A63}
    .t-eyebrow{font-family:'IBM Plex Mono',monospace;font-weight:500;fill:#2A7E7F;letter-spacing:.18em}
    .t-sec{font-family:'Sora',sans-serif;font-weight:600;fill:#0E2240}
    .t-ann{font-family:'IBM Plex Sans',sans-serif;font-weight:500;fill:#1B3358}
    .t-cap{font-family:'IBM Plex Sans',sans-serif;font-weight:400;fill:#6B6358}
    .t-mono{font-family:'IBM Plex Mono',monospace;font-weight:400;fill:#3B4A63}
    .t-white{font-family:'Sora',sans-serif;font-weight:600;fill:#F5F1E8}
    .t-num{font-family:'Sora',sans-serif;font-weight:800;fill:#0E2240}
  </style>

  <!-- ===== Gradients ===== -->
  <radialGradient id="g-tumor" cx="38%" cy="32%" r="75%">
    <stop offset="0%" stop-color="#E88475"/>
    <stop offset="55%" stop-color="#C95D4F"/>
    <stop offset="100%" stop-color="#8E3A30"/>
  </radialGradient>
  <radialGradient id="g-tumor2" cx="40%" cy="35%" r="70%">
    <stop offset="0%" stop-color="#D97565"/>
    <stop offset="60%" stop-color="#B74C40"/>
    <stop offset="100%" stop-color="#7A3028"/>
  </radialGradient>
  <radialGradient id="g-nucleus" cx="40%" cy="38%" r="60%">
    <stop offset="0%" stop-color="#5C1E1A"/>
    <stop offset="100%" stop-color="#2A0E0C"/>
  </radialGradient>
  <radialGradient id="g-tcell" cx="38%" cy="32%" r="70%">
    <stop offset="0%" stop-color="#7FC4C1"/>
    <stop offset="60%" stop-color="#3E9491"/>
    <stop offset="100%" stop-color="#1F5E5C"/>
  </radialGradient>
  <radialGradient id="g-macro" cx="40%" cy="34%" r="72%">
    <stop offset="0%" stop-color="#E0C882"/>
    <stop offset="55%" stop-color="#C9A24B"/>
    <stop offset="100%" stop-color="#8C6C2A"/>
  </radialGradient>
  <radialGradient id="g-fibro" cx="40%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#8FB6B4"/>
    <stop offset="60%" stop-color="#528482"/>
    <stop offset="100%" stop-color="#2E5756"/>
  </radialGradient>
  <radialGradient id="g-core" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#C95D4F" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#C95D4F" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g-stroma" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#2A7E7F" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#2A7E7F" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g-immune" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#3B4A63" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#3B4A63" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FBF8F0"/>
    <stop offset="100%" stop-color="#F1EBDD"/>
  </linearGradient>
  <linearGradient id="g-bar1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#D97565"/><stop offset="100%" stop-color="#B74C40"/>
  </linearGradient>
  <linearGradient id="g-bar2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3E9491"/><stop offset="100%" stop-color="#1F5E5C"/>
  </linearGradient>
  <linearGradient id="g-bar3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C9A24B"/><stop offset="100%" stop-color="#8C6C2A"/>
  </linearGradient>
  <linearGradient id="g-bar4" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6B6358"/><stop offset="100%" stop-color="#4A4339"/>
  </linearGradient>

  <!-- ===== Filters ===== -->
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="0.6"/>
  </filter>
  <filter id="blur-bg" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="dof" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3.2"/>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E2240" flood-opacity="0.18"/>
  </filter>

  <!-- ===== Markers ===== -->
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1B3358"/>
  </marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2A7E7F"/>
  </marker>
  <marker id="arr-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C95D4F"/>
  </marker>
  <marker id="arr-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6B6358"/>
  </marker>
  <marker id="arr-pale" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#A39A8B"/>
  </marker>

  <!-- ===== Cell clip shapes (soft blob) ===== -->
</defs>

<!-- BACKGROUND TEXTURE                                             -->
<!-- ============================================================= -->
<rect width="1920" height="1080" fill="#F5F1E8"/>
<g opacity="0.5">
  <rect x="0" y="0" width="1920" height="1080" fill="url(#g-immune)" opacity="0.0"/>
</g>
<!-- subtle top rule -->
<rect x="0" y="0" width="1920" height="6" fill="#0E2240"/>
<rect x="0" y="6" width="1920" height="1.5" fill="#C9A24B" opacity=".7"/>

<!-- ============================================================= -->
<!-- HEADER                                                         -->
<!-- ============================================================= -->
<g>
  <text x="70" y="74" class="t-eyebrow" font-size="15">SPATIAL MULTI-OMICS · TUMOR MICROENVIRONMENT · CONCEPTUAL MODEL</text>
  <text x="70" y="118" class="t-title" font-size="40">Spatial Multi-omics Reveals Mechanisms of Immune Evasion</text>

</g>

<!-- ============================================================= -->
<!-- HERO : TUMOR MICROENVIRONMENT                                  -->
<!-- ============================================================= -->
<g id="hero">

  <!-- region labels -->

  <text x="640" y="218" class="t-ann" font-size="14" fill="#1F5E5C">STROMAL COMPARTMENT</text>

<!-- ============================================================= -->
<!-- MECHANISTIC DIAGRAM (right of hero, integrated)                -->
<!-- ============================================================= -->

  <!-- nodes -->
  <g font-family="'IBM Plex Sans',sans-serif">

      <rect x="980" y="250" width="250" height="54" rx="7" fill="#FBF8F0" stroke="#C9C0AE"/>

    <!-- node: stromal architecture -->
    <g>
      <rect x="1260" y="250" width="250" height="54" rx="7" fill="#FBF8F0" stroke="#2A7E7F"/>
      <text x="1276" y="273" class="t-ann" font-size="13" fill="#1F5E5C">Stromal architecture</text>
      <text x="1276" y="291" class="t-cap" font-size="11">ECM · CAF network</text>
    </g>
    <!-- node: cell-cell interactions -->
    <g>
      <rect x="980" y="340" width="250" height="54" rx="7" fill="#FBF8F0" stroke="#C95D4F"/>
